<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cab3-Ambi-Stasis</title>
<style>
    :root {
        --bg: #060607;
        --fg: #f4f4f5;
        --hair: rgba(255, 255, 255, .11);
        --hair2: rgba(255, 255, 255, .26);
        --dim: rgba(255, 255, 255, .40);
        --faint: rgba(255, 255, 255, .055);
        --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        --lvl: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* html/body 禁止滚动:任何滚动都会让指针坐标与元素错位。
       body 是视口容器(居中画布 + 钉住缩放三角),
       .canvas 是 320x490 的设计画布,整体由 --zoom 缩放。 */
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
    }

    body {
        --zoom: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .canvas {
        width: 320px;
        height: 490px;
        flex: none;
        padding: 15px 16px 11px;
        transform: scale(var(--zoom));
        transform-origin: center center;
        display: flex;
        flex-direction: column;
        color: var(--fg);
        font-family: -apple-system, "Helvetica Neue", "PingFang SC", Arial, sans-serif;
        font-size: 10px;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
        position: relative;
    }

    /* 拖拽任何控件期间:整个界面只服务于那一个控制单元。
       指针捕获只作用于 pointer 事件,不会阻止浏览器对 <input> 的原生文本
       选择 —— 所以必须显式关掉输入框的指针事件与选择行为。 */
    body.dragging,
    body.dragging * {
        user-select: none !important;
        -webkit-user-select: none !important;
    }
    body.dragging input {
        pointer-events: none !important;
        cursor: default !important;
    }
    body.dragging ::selection {
        background: transparent;
    }

    /* 顶部纵深光:顶部一道极窄的冷白光,往下迅速消失,制造"深场"感
       电平只驱动 opacity(可合成,不重绘整窗) */
    .canvas::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
            radial-gradient(ellipse 150% 62% at 50% -8%,
                rgba(255, 255, 255, .14) 0%,
                rgba(255, 255, 255, .05) 42%,
                transparent 78%);
        opacity: calc(.40 + var(--lvl) * .60);
        will-change: opacity;
    }

    /* 底部压暗,让下半区沉下去 */
    .canvas::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: linear-gradient(to bottom, transparent 55%, rgba(0, 0, 0, .55) 100%);
    }

    .canvas > * { position: relative; z-index: 1; }

    /* ---------------- 顶栏 ---------------- */
    header {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--faint);
    }

    .mark { display: flex; align-items: center; gap: 8px; }
    .mark svg { display: block; width: 11px; height: 11px; }
    .mark circle { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: 1; }
    .mark .core { fill: #fff; }

    .brand {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .42em;
        line-height: 1;
    }

    .tag {
        font-family: var(--mono);
        font-size: 7px;
        letter-spacing: .30em;
        color: var(--dim);
        text-transform: uppercase;
        padding-top: 1px;
    }

    /* ---------------- 雷达区 ---------------- */
    .radar-zone {
        flex: none;
        margin-top: 14px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 13px;
    }

    /* 电平表 = 表柱 + dB 标尺;标尺刻度由 JS 按 dB 位置生成 */
    .metercol { display: flex; flex-direction: column; gap: 5px; }
    .metercol .mlab {
        font-family: var(--mono);
        font-size: 6px;
        letter-spacing: .18em;
        color: rgba(255, 255, 255, .26);
        text-align: center;
    }

    .meterbody { display: flex; align-items: stretch; gap: 3px; }
    .meterbody.mirror { flex-direction: row-reverse; }

    .bar {
        position: relative;
        width: 12px;
        height: 70px;
        flex: none;
    }
    .bar::before, .bar::after {
        content: "";
        position: absolute;
        top: 0; bottom: 0;
        width: 1px;
        background: var(--hair);
    }
    .bar::before { left: 0; }
    .bar::after { right: 0; }

    .bar i {
        position: absolute;
        left: 1px; right: 1px; bottom: 0;
        height: 100%;
        transform-origin: bottom center;
        transform: scaleY(0);
        background: linear-gradient(to top,
            rgba(255, 255, 255, .95) 0%,
            rgba(255, 255, 255, .60) 60%,
            rgba(255, 255, 255, .26) 100%);
        transition: transform .05s linear;
        will-change: transform;
    }
    /* 电平顶端亮帽 */
    .bar b {
        position: absolute;
        left: 0; right: 0;
        height: 1px;
        bottom: 0;
        background: rgba(255, 255, 255, .95);
        transform: translateY(0);
        transition: transform .05s linear, opacity .12s linear;
        opacity: 0;
        will-change: transform;
    }

    /* dB 标尺 */
    .dbscale {
        position: relative;
        width: 23px;
        height: 70px;
        flex: none;
    }
    .dbscale .t {
        position: absolute;
        left: 0; right: 0;
        height: 0;
    }
    .dbscale .t::before {
        content: "";
        position: absolute;
        left: 0; top: 0;
        width: 3px; height: 1px;
        background: rgba(255, 255, 255, .22);
    }
    .dbscale .t.major::before {
        width: 5px;
        background: rgba(255, 255, 255, .42);
    }
    .dbscale .t .n {
        position: absolute;
        right: 0; top: -3.4px;
        font-family: var(--mono);
        font-size: 5.5px;
        line-height: 1;
        letter-spacing: .01em;
        color: rgba(255, 255, 255, .30);
    }
    .dbscale .t.major .n { color: rgba(255, 255, 255, .46); }
    .dbscale .t.zero .n { color: rgba(255, 255, 255, .78); }

    /* 右表镜像:刻度贴右侧、数字靠左 */
    .meterbody.mirror .dbscale .t::before { left: auto; right: 0; }
    .meterbody.mirror .dbscale .t .n { right: auto; left: 0; }

    .radar {
        width: 180px;
        height: 180px;
        position: relative;
        cursor: crosshair;
        touch-action: none;
        /* 暗底:顶部压暗,让远处(顶部)的淡圆弧仍能脱离页面背景被看见;
           底部留一点提亮,承接电平辉光 */
        background:
            radial-gradient(ellipse 130% 85% at 50% 104%,
                rgba(255, 255, 255, .028) 0%, transparent 62%),
            radial-gradient(ellipse 125% 110% at 50% -6%,
                rgba(0, 0, 0, .58) 0%, rgba(0, 0, 0, .20) 58%, rgba(0, 0, 0, 0) 100%);
    }
    .radar > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* 电平驱动的环境辉光,藏在雷达背后(固定渐变 + opacity,避免重绘) */
    .radar::before {
        content: "";
        position: absolute;
        inset: -22px;
        pointer-events: none;
        background: radial-gradient(circle at 50% 78%,
            rgba(255, 255, 255, .13) 0%,
            transparent 68%);
        opacity: var(--lvl);
        will-change: opacity;
    }

    .frame { fill: none; stroke: var(--hair2); stroke-width: 1; transition: stroke .18s ease; }
    /* 距离场同心圆:颜色由 JS 按半径逐层衰减(major 实线、minor 虚线) */
    .ring { fill: none; stroke: #fff; stroke-width: 1; stroke-dasharray: 3 4; }
    .ring.major { stroke-dasharray: none; }
    /* 圆盘模型:Ambi/HRTF 的声场是以听者为圆心的圆盘,
       方形 pad 的四角在圆盘之外,用斜纹标出不可达区域 */
    .deadzone { fill: url(#hatch); }
    .disc { fill: none; stroke: rgba(255, 255, 255, .30); stroke-width: 1; }
    .bracket { fill: none; stroke: rgba(255, 255, 255, .42); stroke-width: 1; transition: stroke .18s ease; }

    .radar:hover .frame { stroke: rgba(255, 255, 255, .45); }
    .radar:hover .bracket { stroke: rgba(255, 255, 255, .85); }

    .ballwrap {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        will-change: transform;
    }
    .ballwrap::before {
        content: "";
        position: absolute;
        inset: -13px;
        border-radius: 50%;
        background: radial-gradient(circle,
            rgba(255, 255, 255, .40) 0%,
            rgba(255, 255, 255, .13) 42%,
            transparent 70%);
    }
    .ballwrap::after {
        content: "";
        position: absolute;
        inset: -23px;
        border-radius: 50%;
        background: radial-gradient(circle,
            rgba(255, 255, 255, .10) 0%,
            transparent 62%);
    }
    .ball {
        position: relative;
        width: 13px; height: 13px;
        border-radius: 50%;
        background: #fff;
        box-shadow:
            0 0 10px 1px rgba(255, 255, 255, .55),
            0 0 22px 3px rgba(255, 255, 255, .18);
    }

    /* ---------------- 数显 ---------------- */
    .readouts {
        flex: none;
        margin-top: 13px;
        display: flex;
        justify-content: center;
        gap: 9px;
    }
    .ro { width: 88px; }
    .ro label {
        display: block;
        text-align: center;
        font-family: var(--mono);
        font-size: 6.5px;
        letter-spacing: .26em;
        color: var(--dim);
        text-transform: uppercase;
        margin-bottom: 6px;
    }
    .ro input {
        width: 100%;
        height: 27px;
        background: rgba(255, 255, 255, .028);
        border: 1px solid var(--hair);
        border-radius: 1px;
        color: #fff;
        text-align: center;
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 300;
        letter-spacing: .06em;
        outline: none;
        transition: border-color .14s ease, background .14s ease, box-shadow .14s ease;
    }
    .ro input:hover { border-color: rgba(255, 255, 255, .22); }
    .ro input:focus {
        border-color: rgba(255, 255, 255, .62);
        background: rgba(255, 255, 255, .055);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, .045);
    }
    .ro input::selection { background: #fff; color: #000; }

    /* ---------------- 混响发送范围 ---------------- */
    .wet { flex: none; margin-top: 15px; }
    .wet .lab {
        text-align: center;
        font-family: var(--mono);
        font-size: 6.5px;
        letter-spacing: .26em;
        color: var(--dim);
        text-transform: uppercase;
        margin-bottom: 10px;
    }
    .dual {
        position: relative;
        width: 186px;
        height: 22px;
        margin: 0 auto;
    }
    /* 刻度尺 */
    .dual .ticks {
        position: absolute;
        left: 0; right: 0; top: 50%;
        height: 7px;
        margin-top: -3.5px;
        background: repeating-linear-gradient(90deg,
            rgba(255, 255, 255, .13) 0 1px,
            transparent 1px 10%);
        pointer-events: none;
    }
    .dual .track {
        position: absolute;
        left: 0; right: 0; top: 50%;
        height: 1px; margin-top: -0.5px;
        background: rgba(255, 255, 255, .16);
    }
    .dual .range {
        position: absolute;
        top: 50%;
        height: 1px;
        margin-top: -0.5px;
        background: #fff;
        box-shadow: 0 0 8px rgba(255, 255, 255, .28);
    }
    .dual .thumb {
        position: absolute;
        top: 50%;
        width: 9px; height: 9px;
        margin-top: -4.5px;
        margin-left: -4.5px;
        border-radius: 50%;
        background: #0a0a0b;
        border: 1px solid rgba(255, 255, 255, .55);
        cursor: ew-resize;
        touch-action: none;
        transition: border-color .14s ease, box-shadow .14s ease, transform .1s ease;
    }
    .dual .thumb:hover {
        border-color: #fff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, .07), 0 0 10px rgba(255, 255, 255, .30);
    }
    .dual .thumb:active { transform: scale(1.12); }

    .wet .vals {
        display: flex;
        justify-content: space-between;
        width: 186px;
        margin: 8px auto 0;
        font-family: var(--mono);
        font-size: 8px;
        font-weight: 300;
        letter-spacing: .08em;
        color: rgba(255, 255, 255, .52);
    }
    .wet .vals input {
        width: 44px;
        padding: 1px 3px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: rgba(255, 255, 255, .72);
        font: inherit;
        letter-spacing: inherit;
        text-align: left;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
        -webkit-appearance: none;
        appearance: none;
    }
    .wet .vals input:last-child { text-align: right; }
    .wet .vals input:focus {
        background: rgba(255, 255, 255, .10);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, .55);
    }

    /* ---------------- 旋钮 ---------------- */
    .knobs {
        flex: none;
        margin-top: 17px;
        display: flex;
        justify-content: center;
        /* 三个旋钮（Room / Damping / Master Gain）要塞进 288px 内宽：
           74×3 + 14×2 = 250，留 38px 余量 */
        gap: 14px;
    }
    .knob {
        width: 74px;
        text-align: center;
        cursor: ns-resize;
        touch-action: none;
        position: relative;
    }
    .knob svg { display: block; width: 62px; height: 62px; margin: 0 auto; overflow: visible; }

    .knob .gauge { fill: none; stroke: rgba(255, 255, 255, .10); stroke-width: 1.5; }
    .knob .arc {
        fill: none;
        stroke: #fff;
        stroke-width: 1.5;
        stroke-linecap: round;
        filter: drop-shadow(0 0 3px rgba(255, 255, 255, .30));
        transition: stroke-dasharray .05s linear;
    }
    .knob .tick { stroke: rgba(255, 255, 255, .20); stroke-width: 1; }
    .knob .tick.major { stroke: rgba(255, 255, 255, .38); }
    /* 旋钮内盘:极淡的径向渐变,让中心不那么"空" */
    .knob .plate { fill: url(#plateGrad); }
    /* 数值输入框:平时不接管指针(整块旋钮都能拖),单击旋钮才进入编辑 */
    .kval {
        position: absolute;
        left: 50%;
        top: 31px;
        transform: translate(-50%, -50%);
        width: 54px;
        height: 16px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: #fff;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 300;
        letter-spacing: .02em;
        text-align: center;
        outline: none;
        pointer-events: none;
        -webkit-user-select: text;
        user-select: text;
        -webkit-appearance: none;
        appearance: none;
    }
    .knob.editing { cursor: text; }
    .knob.editing .kval {
        pointer-events: auto;
        background: rgba(255, 255, 255, .10);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, .55);
    }
    .klab {
        margin-top: 4px;
        font-family: var(--mono);
        font-size: 6.5px;
        letter-spacing: .24em;
        color: var(--dim);
        text-transform: uppercase;
        white-space: nowrap;
    }
    .knob:hover .gauge { stroke: rgba(255, 255, 255, .18); }
    .knob:active .arc { stroke-width: 2; }
    .knob:hover text { fill: #fff; }

    /* ---------------- 缩放三角(右下角) ---------------- */
    .zoomer {
        position: absolute;
        right: 0; bottom: 0;
        width: 30px; height: 30px;
        padding: 0;
        border: 0;
        background: none;
        cursor: ns-resize;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        z-index: 20;
    }
    .zoomer svg { display: block; width: 13px; height: 13px; margin: 0 4px 4px 0; }
    .zoomer path { fill: rgba(255, 255, 255, .30); transition: fill .14s ease; }
    .zoomer:hover path { fill: rgba(255, 255, 255, .92); }
    .zoomer:active path { fill: #fff; }
    /* 宿主是否接受窗口 resize:实心=接受,空心=拒绝 */
    .zoomer[data-host="accepted"] path { fill: rgba(255, 255, 255, .62); }
    .zoomer[data-host="rejected"] path {
        fill: none;
        stroke: rgba(255, 255, 255, .46);
        stroke-width: 1.1;
    }
    .zoomer[data-host="rejected"]:hover path { stroke: rgba(255, 255, 255, .9); fill: none; }
    .zoomer .zpct {
        position: absolute;
        right: 20px; bottom: 3px;
        font-family: var(--mono);
        font-size: 6px;
        letter-spacing: .10em;
        color: rgba(255, 255, 255, .60);
        opacity: 0;
        transition: opacity .14s ease;
        pointer-events: none;
        white-space: nowrap;
    }
    .zoomer:hover .zpct { opacity: 1; }
    body.dragging-zoom .zoomer .zpct { opacity: 1; }

    /* ---------------- 底栏 ---------------- */
    footer {
        flex: none;
        margin-top: auto;
        padding-top: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        text-transform: uppercase;
    }
    footer .engine {
        font-size: 8.5px;
        letter-spacing: .30em;
        color: rgba(255, 255, 255, .34);
    }

    /* ===== 4 声道电平表：与 Quad 逐字一致 =====
       固定高度带 + space-between 把两个表推到两端，
       再把 .bar/.dbscale 高度覆盖成能塞进带内的值，避免压到下方控件。 */
    .mside {
        flex: none;
        width: 34px;
        height: 180px;
        margin-top: 0;
        align-self: center;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
</style>
</head>
<body>

<div class="canvas" id="canvas">

<header>
    <div class="mark">
        <svg class="mark" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="width:13px;height:13px;flex:none;display:block">
  <circle cx="8" cy="8" r="5.9" stroke="#ffffff" stroke-width="1"/>
  <circle cx="8" cy="8" r="1.7" fill="#ffffff"/>
</svg>
        <span class="brand">STASIS</span>
    </div>
    <span class="tag">4ch Ambisonics</span>
</header>

<section class="radar-zone">
    <div class="mside left">
        <div class="metercol">
            <span class="mlab">FL</span>
            <div class="meterbody">
                <div class="bar"><i id="mtrFL"></i><b id="capFL"></b></div>
                <div class="dbscale" id="scaleFL"></div>
            </div>
        </div>
        <div class="metercol">
            <span class="mlab">RL</span>
            <div class="meterbody">
                <div class="bar"><i id="mtrRL"></i><b id="capRL"></b></div>
                <div class="dbscale" id="scaleRL"></div>
            </div>
        </div>
    </div>

    <div class="radar" id="radar">
        <svg viewBox="0 0 180 180" aria-hidden="true">
            <defs>
                <radialGradient id="plateGrad" cx="50%" cy="38%" r="62%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.055)"/>
                    <stop offset="72%" stop-color="rgba(255,255,255,0.012)"/>
                    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                </radialGradient>
                <clipPath id="padClip">
                    <rect x="0" y="0" width="180" height="180"/>
                </clipPath>
            </defs>

            <!-- 斜纹图案:标出圆盘之外(方形四角)的不可达区域 -->
            <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse"
                     patternTransform="rotate(45)">
                <line x1="0" y1="0" x2="0" y2="7"
                      stroke="rgba(255,255,255,.085)" stroke-width="1"/>
            </pattern>

            <!-- 圆盘可用区:内外两条子路径 + evenodd 挖掉圆盘,只保留四角斜纹 -->
            <path class="deadzone" fill-rule="evenodd"
                  d="M0 0H180V180H0Z M90 0A90 90 0 1 0 90 180A90 90 0 1 0 90 0Z"/>

            <!-- 距离场:以画布中央 (90,90) 为圆心的同心圆,只画到盘边 -->
            <g clip-path="url(#padClip)" id="rings"></g>

            <!-- 圆盘边界 = 最大距离 (归一化半径 1) -->
            <circle class="disc" cx="90" cy="90" r="90"/>

            <!-- 外框 + 四角括号 -->
            <rect class="frame" x="0.5" y="0.5" width="179" height="179"/>
            <path class="bracket" d="M 0.5 14 L 0.5 0.5 L 14 0.5"/>
            <path class="bracket" d="M 166 0.5 L 179.5 0.5 L 179.5 14"/>
            <path class="bracket" d="M 179.5 166 L 179.5 179.5 L 166 179.5"/>
            <path class="bracket" d="M 14 179.5 L 0.5 179.5 L 0.5 166"/>
        </svg>

        <div class="ballwrap" id="ballWrap">
            <div class="ball"></div>
        </div>
    </div>

    <div class="mside right">
        <div class="metercol">
            <span class="mlab">FR</span>
            <div class="meterbody mirror">
                <div class="bar"><i id="mtrFR"></i><b id="capFR"></b></div>
                <div class="dbscale" id="scaleFR"></div>
            </div>
        </div>
        <div class="metercol">
            <span class="mlab">RR</span>
            <div class="meterbody mirror">

<script type="module">
import { Cabbage } from './cabbage/cabbage.js';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = id => document.getElementById(id);

/* def 必须与 CSD 里该通道的 defaultValue 完全一致 —— 双击归位回到的就是它 */
const KNOBS = {
    /* curve 是纯前端手感，不写进 CSD（宿主只认值）。
       房间 10~100 是 1 个数量级 → k=1；截止 1000~16000 是 1.2 个 → k=3。 */
    roomSize: { min: 10, max: 100, curve: 1, step: 0.1, def: 50,   fmt: v => String(Math.round(v)) },
    cutoff:   { min: 1000, max: 16000, curve: 3, step: 1, def: 16000, fmt: fmtHz },
    masterGain: { min: 0, max: 8,     curve: 0, step: 0.01, def: 2, fmt: v => v.toFixed(2) }
};
/* 湿声上下限默认值（与 CSD 一致） */
const WET_DEF = { minWet: 0.1, maxWet: 0.6 };
const PARAM_IDX = ['x', 'y', 'minWet', 'maxWet', 'roomSize', 'cutoff', 'masterGain'];

let X = 0.5, Y = 0.5;
let minWet = 0.1, maxWet = 0.6;
let room = 50, cut = 16000, gain = 2;

const dragOn = { radar: false, wet: null, roomSize: false, cutoff: false, masterGain: false, zoom: false };

/* 拖拽期间进入"独占控制单元"状态:屏蔽输入框的原生文本选择/拖选,
   避免拖动准星经过 X/Y 数显时把它们选中。 */
function beginDrag() {
    document.body.classList.add('dragging');
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
}
function endDrag() {
    document.body.classList.remove('dragging');
}

/* 兜底:某些宿主 WebView 仍会触发这两个事件 */
const anyDrag = () => document.body.classList.contains('dragging') ||
                       document.body.classList.contains('dragging-zoom') ||
                       Object.values(dragOn).some(Boolean);
for (const ev of ['selectstart', 'dragstart']) {
    document.addEventListener(ev, e => {
        /* 输入框里必须允许选中文本，否则没法改数值 */
        if (e.target && e.target.closest && e.target.closest('input')) return;
        if (anyDrag()) e.preventDefault();
    });
}

/* 安全网:指针在窗口外松开或窗口失焦时,pointerup 可能收不到 */
window.addEventListener('blur', () => {
    dragOn.radar = false;
    dragOn.wet = null;
    dragOn.roomSize = false;
    dragOn.cutoff = false;
    endDrag();
});

/* 显示完整数字，不用 6k 这类缩写；频率单位在标签里体现（Damp / Damping） */
function fmtHz(v) {
    return String(Math.round(v));
}
const fmt01 = v => (Math.round(v * 1000) / 1000).toFixed(3);

/* ---------------- 雷达 ---------------- */
/* 声场是圆盘:归一化坐标里圆盘半径 = 0.5,圆外(in aX/aY 意义上)不可达。
   拖拽时把点钳制到圆内;宿主自动化给出圆外值时,球只做显示钳制,
   参数本身不篡改(避免与宿主互相拉扯),DSP 侧另有 clamp 兜底。 */
const DISC_R = 0.5;
function clampToDisc(x, y) {
    const dx = x - 0.5, dy = y - 0.5;
    const d = Math.hypot(dx, dy);
    if (d <= DISC_R || d === 0) return [x, y];
    return [0.5 + dx / d * DISC_R, 0.5 + dy / d * DISC_R];
}

function placeBall() {
    const b = $('ballWrap');
    const [bx, by] = clampToDisc(clamp(X, 0, 1), clamp(Y, 0, 1));
    b.style.left = (bx * 100).toFixed(2) + '%';
    b.style.top = ((1 - by) * 100).toFixed(2) + '%';
}

const radar = $('radar');
const radarFrom = e => {
    const r = radar.getBoundingClientRect();
    const nx = clamp((e.clientX - r.left) / r.width, 0, 1);
    const ny = clamp(1 - (e.clientY - r.top) / r.height, 0, 1);
    [X, Y] = clampToDisc(nx, ny);
    placeBall();
    setReadout('box_x', X);
    setReadout('box_y', Y);
};
const sendXY = g => {
    Cabbage.sendControlData({ channel: 'x', value: X, gesture: g }, null);
    Cabbage.sendControlData({ channel: 'y', value: Y, gesture: g }, null);
};

radar.addEventListener('pointerdown', e => {
    dragOn.radar = true;
    beginDrag();
    radar.setPointerCapture(e.pointerId);
    e.preventDefault();
    radarFrom(e);
    sendXY('begin');
});
radar.addEventListener('pointermove', e => {
    if (!dragOn.radar) return;
    e.preventDefault();
    radarFrom(e);
    sendXY('value');
});
const radarEnd = () => {
    if (!dragOn.radar) return;
    dragOn.radar = false;
    endDrag();
    sendXY('end');
};
radar.addEventListener('pointerup', radarEnd);
radar.addEventListener('pointercancel', radarEnd);
radar.addEventListener('dblclick', () => {
    X = 0.5; Y = 0.5;
    placeBall();
    /* force=true：输入框可能正处于编辑态，守卫会跳过写入 */
    setReadout('box_x', 0.5, true);
    setReadout('box_y', 0.5, true);
    sendXY('complete');
});

/* ---------------- 数显 ---------------- */
function setReadout(id, v, force) {
    const el = $(id);
    /* 编辑中不覆盖用户输入；但 force=true（双击归位）时必须写 */
    if (force || document.activeElement !== el) el.value = fmt01(v);
}
function bindReadout(id) {
    const el = $(id);
    const commit = () => {
        const raw = parseFloat(el.value.replace(',', '.'));
        if (isNaN(raw)) { setReadout(id, id === 'box_x' ? X : Y); return; }
        const v = clamp(raw, 0, 1);
        el.value = fmt01(v);
        if (id === 'box_x') X = v; else Y = v;
        placeBall();
        Cabbage.sendControlData({ channel: id, value: v, gesture: 'complete' }, null);
    };
    el.addEventListener('focus', () => el.select());
    el.addEventListener('change', commit);
    el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
    /* 双击归位到中心（与雷达双击行为一致） */
    el.addEventListener('dblclick', e => {
        e.preventDefault();
        X = 0.5; Y = 0.5;
        placeBall();
        /* force=true：此刻 el 就是 activeElement，不加 force 会被守卫跳过 */
        setReadout('box_x', 0.5, true);
        setReadout('box_y', 0.5, true);
        sendXY('complete');
    });
}
bindReadout('box_x');
bindReadout('box_y');
bindWetField('wetMinOut', 'minWet');
bindWetField('wetMaxOut', 'maxWet');

/* ---------------- 混响发送范围 ---------------- */
const dual = $('dual');
function paintWet() {
    const w = dual.clientWidth;
    const l = minWet * w, r = maxWet * w;
    $('wetRange').style.left = l + 'px';
    $('wetRange').style.width = Math.max(0, r - l) + 'px';
    $('thumbMin').style.left = l + 'px';
    $('thumbMax').style.left = r + 'px';
    if (wetEditing.key !== 'minWet') $('wetMinOut').value = minWet.toFixed(2);
    if (wetEditing.key !== 'maxWet') $('wetMaxOut').value = maxWet.toFixed(2);
}

/* 湿声上下限：数字在拖动区之外，直接 focus 即可编辑 */
const wetEditing = { key: null };
function bindWetField(id, key) {
    const el = $(id);
    const p = { min: 0, max: 1, step: 0.01 };

    const commit = () => {
        if (wetEditing.key !== key) return;
        wetEditing.key = null;
        const v = parseNum(el.value, p);
        if (!isFinite(v)) { paintWet(); return; }
        if (key === 'minWet') minWet = clamp(v, 0, Math.max(0, maxWet - 0.02));
        else maxWet = clamp(v, Math.min(1, minWet + 0.02), 1);
        paintWet();
        Cabbage.sendControlData({ channel: key, value: key === 'minWet' ? minWet : maxWet, gesture: 'complete' }, null);
    };

    el.addEventListener('focus', () => { wetEditing.key = key; el.select(); });
    el.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); commit(); el.blur(); }
        else if (e.key === 'Escape') { e.preventDefault(); wetEditing.key = null; paintWet(); el.blur(); }
    });
    el.addEventListener('blur', commit);
    el.addEventListener('pointerdown', e => e.stopPropagation());
    el.addEventListener('dblclick', e => {
        e.preventDefault();
        wetEditing.key = null;
        if (key === 'minWet') minWet = WET_DEF.minWet; else maxWet = WET_DEF.maxWet;
        paintWet();
        el.blur();
        Cabbage.sendControlData({ channel: key, value: key === 'minWet' ? minWet : maxWet, gesture: 'complete' }, null);
    });
}
const wetFrom = e => {
    const f = clamp((e.clientX - dual.getBoundingClientRect().left) / dual.clientWidth, 0, 1);
    if (dragOn.wet === 'min') minWet = Math.min(f, maxWet - 0.02);
    else maxWet = Math.max(f, minWet + 0.02);
    paintWet();
    return dragOn.wet === 'min' ? minWet : maxWet;
};
function bindThumb(id, which) {
    const el = $(id);
    const ch = which === 'min' ? 'minWet' : 'maxWet';
    el.addEventListener('pointerdown', e => {
        dragOn.wet = which;
        beginDrag();
        el.setPointerCapture(e.pointerId);
        e.preventDefault();
        Cabbage.sendControlData({ channel: ch, value: wetFrom(e), gesture: 'begin' }, null);
    });
    el.addEventListener('pointermove', e => {
        if (dragOn.wet !== which) return;
        e.preventDefault();
        Cabbage.sendControlData({ channel: ch, value: wetFrom(e), gesture: 'value' }, null);
    });
    const up = () => {
        if (dragOn.wet !== which) return;
        dragOn.wet = null;
        endDrag();
        Cabbage.sendControlData({ channel: ch, value: which === 'min' ? minWet : maxWet, gesture: 'end' }, null);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
}
bindThumb('thumbMin', 'min');
bindThumb('thumbMax', 'max');

/* ---------------- 旋钮 ---------------- */
const R = 27;
const C = 2 * Math.PI * R;
const SPAN = C * 0.75;

/* ---------------- 旋钮映射曲线（与 Singularity 同一套，见模板 §6.16）
   归一化值 n ∈ [0,1] ↔ 旋钮行程 f ∈ [0,1]，一个数 curve 定整条曲线：
     curve = 0    线性
     curve = k>0  指数：低端展开（时间 / 频率这类跨数量级参数必须给）
     curve = k<0  反向：高端展开
   n = (e^(k·f) − 1) / (e^k − 1)      f = ln(1 + n·(e^k − 1)) / k
   两式严格互逆，拖动 → 写值 → 回灌 → 重画不会漂。 */
const CURVE_MAX_K = 12;                 // e^12 ≈ 1.6e5，防溢出
const curveToNorm = (f, k) => {
    if (!k) return f;
    const K = Math.min(Math.abs(k), CURVE_MAX_K), A = Math.exp(K) - 1;
    return k > 0 ? (Math.exp(K * f) - 1) / A
                 : 1 - (Math.exp(K * (1 - f)) - 1) / A;
};
const normToCurve = (n, k) => {
    if (!k) return n;
    const K = Math.min(Math.abs(k), CURVE_MAX_K), A = Math.exp(K) - 1;
    return k > 0 ? Math.log(1 + n * A) / K
                 : 1 - Math.log(1 + (1 - n) * A) / K;
};

const toFrac   = (v, r) => normToCurve(clamp((v - r.min) / (r.max - r.min), 0, 1), r.curve || 0);
const fromFrac = (f, r) => r.min + (r.max - r.min) * curveToNorm(clamp(f, 0, 1), r.curve || 0);

/* 沿仪表弧均匀铺刻度:θ 从 225° 起,顺时针 270° */
function buildTicks(groupId) {
    const g = $(groupId);
    const NS = 'http://www.w3.org/2000/svg';
    for (let i = 0; i <= 20; i++) {
        const f = i / 20;
        const deg = 225 + f * 270;
        const rad = deg * Math.PI / 180;
        const major = i % 5 === 0;
        const r1 = major ? 29.4 : 30.0;
        const r2 = 32;
        const line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', (32 + r1 * Math.sin(rad)).toFixed(2));
        line.setAttribute('y1', (32 - r1 * Math.cos(rad)).toFixed(2));
        line.setAttribute('x2', (32 + r2 * Math.sin(rad)).toFixed(2));
        line.setAttribute('y2', (32 - r2 * Math.cos(rad)).toFixed(2));
        line.setAttribute('class', major ? 'tick major' : 'tick');
        g.appendChild(line);
    }
}

const KNOB_TXT = { roomSize: 'roomOut', cutoff: 'cutOut', masterGain: 'gainOut' };
const KNOB_ID  = { roomSize: 'knobRoom', cutoff: 'knobCut', masterGain: 'knobGain' };
const KNOB_ARC = { roomSize: 'arcRoom', cutoff: 'arcCut', masterGain: 'arcGain' };

/* 解析数值输入：支持 6k / 6.5k / 50 / 0.25 */
function parseNum(raw, p) {
    let t = String(raw).trim().toLowerCase().replace(/\s+/g, '');
    if (!t) return NaN;
    let mul = 1;
    if (t.endsWith('k')) { mul = 1000; t = t.slice(0, -1); }
    else if (t.endsWith('hz')) { t = t.slice(0, -2); }
    const n = parseFloat(t);
    if (!isFinite(n)) return NaN;
    const v = n * mul;
    return clamp(Math.round(v / p.step) * p.step, p.min, p.max);
}

const knobVal = key => key === 'roomSize' ? room : key === 'cutoff' ? cut : gain;
const setKnobVal = (key, v) => {
    if (key === 'roomSize') room = v;
    else if (key === 'cutoff') cut = v;
    else gain = v;
};

/* 编辑态：正在敲的那个输入框不要被后端推送覆盖 */
const editing = { key: null, el: null, knob: null };
const DBL_MS = 350;
let lastTapAt = 0, lastTapKey = null;

function paintKnob(id, key) {
    const v = knobVal(key);
    const r = KNOBS[key];
    const f = toFrac(clamp(v, r.min, r.max), r);
    $(KNOB_ARC[key]).setAttribute('stroke-dasharray', (f * SPAN).toFixed(2) + ' ' + C.toFixed(2));
    if (editing.key === key) return;
    $(KNOB_TXT[key]).value = r.fmt(v);
}

function openEditor(key, el) {
    if (editing.el === el) { el.select(); return; }
    closeEditor(true);
    editing.key = key;
    editing.el = el;
    editing.knob = el.closest('.knob');
    if (editing.knob) editing.knob.classList.add('editing');
    el.value = KNOBS[key].fmt(knobVal(key));
    el.focus();
    el.select();
}

function closeEditor(silent) {
    const el = editing.el;
    if (!el) return;
    const wasKey = editing.key;
    editing.key = null;
    editing.el = null;
    if (editing.knob) editing.knob.classList.remove('editing');
    editing.knob = null;
    if (!silent) { el.blur(); if (wasKey) paintKnob(KNOB_ID[wasKey], wasKey); }
}

function commitKnobEdit() {
    const key = editing.key;
    if (!key) return;
    const v = parseNum(editing.el.value, KNOBS[key]);
    closeEditor();
    const id = KNOB_ID[key];
    if (!isFinite(v)) { paintKnob(id, key); return; }
    setKnobVal(key, v);
    paintKnob(id, key);
    Cabbage.sendControlData({ channel: key, value: v, gesture: 'complete' }, null);
}

function resetKnob(id, key) {
    const d = KNOBS[key].def;
    setKnobVal(key, d);
    paintKnob(id, key);
    Cabbage.sendControlData({ channel: key, value: d, gesture: 'complete' }, null);
}

function bindKnob(id, key) {
    const el = $(id);
    const txt = $(KNOB_TXT[key]);
    /* 统一逻辑：不在 pointerdown 里按 target 分叉。
       数值框在编辑态才 pointer-events:auto，若在此处提前 return，
       第二次点击就会绕过双击判定，导致「点数字 → 再点」永远归不了位。
       所以一律记录 tap，只是命中 input 时不抢焦点、不 preventDefault。 */
    let startY = 0, startX = 0, startF = 0, accF = 0, lastY = 0, dragging = false, active = false, onInput = false, moved = false;

    el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        active = true;
        dragging = false;
        onInput = (e.target === txt);
        startX = e.clientX;
        moved = false;
        startY = e.clientY;
        startF = toFrac(knobVal(key), KNOBS[key]);
        accF = startF;
        lastY = e.clientY;
        if (!onInput) {
            el.setPointerCapture(e.pointerId);
            e.preventDefault();
        }
    });

    el.addEventListener('pointermove', e => {
        if (!active) return;
        /* 编辑态：只记录有没有发生选词拖动，绝不旋钮拖动 */
        if (onInput) {
            if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) moved = true;
            return;
        }
        const dy = startY - e.clientY;
        if (!dragging) {
            if (Math.abs(dy) < 3) return;                      // 死区：留给单击编辑
            dragging = true;
            dragOn[key] = true;
            beginDrag();
            closeEditor(true);
            Cabbage.sendControlData({ channel: key, value: knobVal(key), gesture: 'begin' }, null);
        }
        e.preventDefault();
        const r = KNOBS[key];
        /* Shift 精调：同样位移只走 1/5 行程。
           ★ 必须按「每帧增量」累加，不能用 (起点 → 当前) 的总位移：
             否则拖动中途按下/松开 Shift，分母突变，数值会瞬间跳一大截。 */
        accF = clamp(accF + (lastY - e.clientY) / (e.shiftKey ? 800 : 160), 0, 1);
        lastY = e.clientY;
        let v = fromFrac(accF, r);
        v = clamp(Math.round(v / r.step) * r.step, r.min, r.max);
        setKnobVal(key, v);
        paintKnob(id, key);
        Cabbage.sendControlData({ channel: key, value: v, gesture: 'value' }, null);
    });

    const up = e => {
        if (!active) return;
        active = false;
        const wasInput = onInput;
        const wasMoved = moved;
        onInput = false;
        moved = false;
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}

        if (dragging) {
            dragging = false;
            dragOn[key] = false;
            endDrag();
            Cabbage.sendControlData({ channel: key, value: knobVal(key), gesture: 'end' }, null);
            return;
        }

        /* 在文本框里拖动 = 选词，不算点击，更不能触发归位 */
        if (wasMoved) { lastTapAt = 0; lastTapKey = null; return; }

        /* 未拖动 = 单击。双击（两次 tap 间隔 < DBL_MS）→ 归位 */
        const now = performance.now();
        if (lastTapKey === key && now - lastTapAt < DBL_MS) {
            lastTapAt = 0; lastTapKey = null;
            closeEditor();
            resetKnob(id, key);
            return;
        }
        lastTapAt = now; lastTapKey = key;
        /* 点在数值框上说明已经在编辑，不重复聚焦 */
        if (!wasInput) openEditor(key, txt);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('contextmenu', e => e.preventDefault());

    txt.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); commitKnobEdit(); }
        else if (e.key === 'Escape') {
            e.preventDefault();
            const k = editing.key;
            closeEditor();
            if (k) paintKnob(k === 'roomSize' ? 'knobRoom' : 'knobCut', k);
        }
    });
    txt.addEventListener('blur', () => { if (editing.key === key) commitKnobEdit(); });
    /* 不 stopPropagation：编辑态下第二击的 target 是 input，
       若挡住冒泡，knob 收不到 pointerdown，双击归位永远不触发。
       拖动由 pointermove 里的 onInput 守卫拦住。 */
    txt.addEventListener('dblclick', e => {
        e.preventDefault(); e.stopPropagation();
        closeEditor();
        resetKnob(id, key);
    });
}
bindKnob('knobRoom', 'roomSize');
bindKnob('knobCut', 'cutoff');
bindKnob('knobGain', 'masterGain');

/* ---------------- 电平 ----------------
   Csound 送来的是线性幅度(0dbfs=1 → 0..1),
   表柱按 dB 显示:0 dB 在顶,-60 dB 在底。 */
const METER_H = 70;
const DB_MIN = -60;
/* 刻度:越靠近 0 dB 越密,符合等响感知 */
const DB_TICKS = [0, -6, -12, -18, -24, -30, -40, -50, -60];

const ampToDb = a => 20 * Math.log10(Math.max(Math.abs(a), 1e-6));
const dbToPos = db => clamp((db - DB_MIN) / (0 - DB_MIN), 0, 1);

function buildDbScales() {
    for (const id of ['scaleFL', 'scaleFR', 'scaleRL', 'scaleRR']) {
        const el = $(id);
        el.innerHTML = '';
        for (const db of DB_TICKS) {
            const t = document.createElement('div');
            t.className = 't'
                + (db === 0 ? ' zero' : '')
                + (db % 12 === 0 ? ' major' : '');
            t.style.bottom = (dbToPos(db) * 100).toFixed(3) + '%';
            const n = document.createElement('span');
            n.className = 'n';
            n.textContent = db === 0 ? '0' : String(db);
            t.appendChild(n);
            el.appendChild(t);
        }
    }
}

/* 距离场同心圆:圆心在画布中央 (90,90),只画到盘边。
   Ambi / HRTF 的声场是圆盘,盘边(半径 90 SVG = 归一化 1)就是最大距离;
   圆盘之外的四角不可达,由 .deadzone 压暗。
   透明度随半径递减,象征距离越远越淡。 */
const RING_CX = 90;
const RING_CY = 90;
const RING_DISC = 90;                                            // 圆盘半径 = 归一化半径 1
const RING_MIN = 15;
const RING_STEP = 15;
const RING_LAST = RING_DISC - RING_STEP;                        // 75，盘边由 .disc 单独画

function buildRings() {
    const g = $('rings');
    const NS = 'http://www.w3.org/2000/svg';
    g.innerHTML = '';
    for (let r = RING_MIN; r <= RING_LAST; r += RING_STEP) {
        const t = (r - RING_MIN) / (RING_DISC - RING_MIN);   // 0 = 最近,1 = 盘边
        // 单调递减;下限 0.085 保证到盘边仍能看见
        const a = 0.34 * Math.pow(1 - t, 1.05) + 0.085;
        const major = r % 30 === 0;

        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', RING_CX);
        c.setAttribute('cy', RING_CY);
        c.setAttribute('r', r);
        c.setAttribute('class', major ? 'ring major' : 'ring');
        c.setAttribute('stroke-opacity', a.toFixed(3));
        g.appendChild(c);
    }
}

function setMeter(id, capId, amp) {
    const db = clamp(ampToDb(amp), DB_MIN, 0);
    const pos = dbToPos(db);
    $(id).style.transform = 'scaleY(' + pos.toFixed(4) + ')';
    const cap = $(capId);
    cap.style.transform = 'translateY(' + (-pos * METER_H).toFixed(1) + 'px)';
    cap.style.opacity = pos > 0.002 ? '.95' : '0';
    return amp;
}
function updateGlow(l, r) {
    const lvl = clamp(Math.max(l, r), 0, 1);
    document.documentElement.style.setProperty('--lvl', lvl.toFixed(3));
}

/* ---------------- 接收后端 ---------------- */
let lvlL = 0, lvlR = 0, lvlRL = 0, lvlRR = 0;

function applyValue(id, v) {
    if (typeof v !== 'number' || isNaN(v)) return;
    switch (id) {
        case 'x':
            if (dragOn.radar) break;
            X = clamp(v, 0, 1);
            placeBall();
            break;
        case 'y':
            if (dragOn.radar) break;
            Y = clamp(v, 0, 1);
            placeBall();
            break;
        case 'box_x':
            if (dragOn.radar) return;
            setReadout('box_x', v);
            X = clamp(v, 0, 1);
            placeBall();
            break;
        case 'box_y':
            if (dragOn.radar) return;
            setReadout('box_y', v);
            Y = clamp(v, 0, 1);
            placeBall();
            break;
        case 'minWet':
            if (dragOn.wet === 'min') break;
            minWet = clamp(v, 0, 1);
            paintWet();
            break;
        case 'maxWet':
            if (dragOn.wet === 'max') break;
            maxWet = clamp(v, 0, 1);
            paintWet();
            break;
        case 'roomSize':
            if (dragOn.roomSize) break;
            room = clamp(v, 10, 100);
            paintKnob('knobRoom', 'roomSize');
            break;
        case 'cutoff':
            if (dragOn.cutoff) break;
            cut = clamp(v, 1000, 16000);
            paintKnob('knobCut', 'cutoff');
            break;
        case 'masterGain':
            if (dragOn.masterGain) break;
            gain = clamp(v, 0, 8);
            paintKnob('knobGain', 'masterGain');
            break;
        case 'outFL':
            lvlL = setMeter('mtrFL', 'capFL', v);
            updateGlow(Math.max(lvlL, lvlRL), Math.max(lvlR, lvlRR));
            break;
        case 'outFR':
            lvlR = setMeter('mtrFR', 'capFR', v);
            updateGlow(Math.max(lvlL, lvlRL), Math.max(lvlR, lvlRR));
            break;
        case 'outRL':
            lvlRL = setMeter('mtrRL', 'capRL', v);
            updateGlow(lvlL, lvlRL);
            break;
        case 'outRR':
            lvlRR = setMeter('mtrRR', 'capRR', v);
            updateGlow(lvlL, lvlRR);
            break;
    }
}

Cabbage.addMessageListener(msg => {
    const data = msg.data ?? msg;
    if (msg.command === 'widgetUpdate') {
        const id = data.id ?? data.channel;
        const v = data.value !== undefined ? data.value : Cabbage.extractValue(data, id);
        applyValue(id, v);
    } else if (msg.command === 'batchWidgetUpdate') {
        for (const w of msg.widgets ?? []) {
            const e = w.data ?? w;
            applyValue(e.id, Cabbage.extractValue(e, e.id));
        }
    } else if (msg.command === 'parameterChange') {
        const pm = msg.data ?? msg;
        const id = typeof pm.channel === 'string' ? pm.channel : PARAM_IDX[pm.paramIdx];
        if (id) applyValue(id, pm.value);
    }
});

/* ---------------- 窗口缩放 ----------------
   两条腿：
   1. 向宿主请求改变窗口尺寸（Cabbage.requestResize → CLAP → AUv2 gui_request_resize）
   2. 画布按实际视口自适应，宿主不配合时也填满可用空间
   交互：右下角三角往下拖变大、往上拖变小，双击回 100%。
   下限 75%；上限由屏幕宽高共同决定，留 6% 余量保证三角始终可点。 */
const CANVAS = { w: 320, h: 490 };
const MIN_SCALE = 0.75;
const MAX_FILL = 0.94;
const screenW = () => (screen.availWidth || screen.width || 0);
const screenH = () => (screen.availHeight || screen.height || 0);

function maxScale() {
    const sw = screenW(), sh = screenH();
    const byW = sw ? sw / CANVAS.w : 3;
    const byH = sh ? sh / CANVAS.h : 3;
    /* 不能给下限兜底，否则小屏上「兜底值」会反过来突破高度上限 */
    return Math.max(MIN_SCALE, Math.min(12, Math.min(byW, byH) * MAX_FILL));
}

const viewScale = () => Math.min(innerWidth / CANVAS.w, innerHeight / CANVAS.h);
/* 拖动基准必须用屏幕绝对坐标：clientY 相对窗口，宿主 resize 时窗口会移动，
   指针没动 clientY 却变了，会反馈进公式形成正反馈。 */
const yOf = e => (typeof e.screenY === 'number' && e.screenY !== 0) ? e.screenY : e.clientY;

let hostResize = 'unknown', reqViewport = 0, reqTimer = 0;
let zoomDrag = null, holdScale = null;
let pendingScale = null, rafId = 0, lastSent = 0, dragEndedAt = 0;

function paintZoomBadge(override) {
    const sc = override != null ? override : viewScale();
    /* 拖动时也要立刻缩放：画布必须「领先」窗口，否则先露白边 */
    document.body.style.setProperty('--zoom', sc.toFixed(4));
    $('zpct').textContent = Math.round(sc * 100) + '%';
    $('zoomer').dataset.host = hostResize;
}

function fitToViewport() {
    if (reqViewport && (innerWidth !== reqViewport.w || innerHeight !== reqViewport.h)) {
        reqViewport = 0; clearTimeout(reqTimer); hostResize = 'accepted';
    }
    if (holdScale != null && Math.abs(viewScale() - holdScale) < 0.01) holdScale = null;
    paintZoomBadge(zoomDrag && zoomDrag.moved ? zoomDrag.target : (holdScale ?? undefined));
}

function requestWindowScale(sc) {
    let w = Math.round(CANVAS.w * sc);
    let h = Math.round(CANVAS.h * sc);
    /* 二次钳制：双击复位等路径会绕开 clamp，必须在这里再兜一次 */
    const limit = Math.floor(screenH() * MAX_FILL);
    if (limit > 0 && h > limit) { h = limit; w = Math.round(h * CANVAS.w / CANVAS.h); }
    reqViewport = { w: innerWidth, h: innerHeight };
    clearTimeout(reqTimer);
    reqTimer = setTimeout(() => {
        if (reqViewport) { reqViewport = 0; hostResize = 'rejected'; holdScale = null; paintZoomBadge(); }
    }, 600);
    Cabbage.requestResize(w, h, null);
}

function scheduleResizeRequest() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
        rafId = 0;
        if (pendingScale == null) return;
        if (lastSent && Math.abs(pendingScale - lastSent) < 0.004) return;
        lastSent = pendingScale;
        requestWindowScale(lastSent);
    });
}

$('zoomer').addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    $('zoomer').setPointerCapture(e.pointerId);
    const sc = viewScale();
    /* ceiling 不能低于当前比例，否则「往下拖想变大」第一帧反而缩一下 */
    zoomDrag = { anchorY: yOf(e), startScale: sc, moved: false, target: sc,
                 ceiling: Math.max(sc, maxScale()) };
    dragOn.zoom = true;
    document.body.classList.add('dragging-zoom');
});

$('zoomer').addEventListener('pointermove', e => {
    if (!zoomDrag) return;
    /* 拖的是右下角：往下 = 拉角出去 = 变大 */
    const dy = yOf(e) - zoomDrag.anchorY;
    if (!zoomDrag.moved && Math.abs(dy) < 2) return;     // 死区，保住双击
    zoomDrag.moved = true;
    e.preventDefault();
    const raw = zoomDrag.startScale * Math.exp(dy / 220);
    const target = Math.min(zoomDrag.ceiling, Math.max(MIN_SCALE, raw));
    zoomDrag.target = target;
    pendingScale = target;
    paintZoomBadge(target);
    scheduleResizeRequest();
});

function endZoomDrag(e) {
    if (!zoomDrag) return;
    const moved = zoomDrag.moved;
    const finalScale = zoomDrag.target;
    zoomDrag = null;
    pendingScale = null;
    dragOn.zoom = false;
    document.body.classList.remove('dragging-zoom');
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    try { $('zoomer').releasePointerCapture(e.pointerId); } catch (_) {}
    if (moved) {
        dragEndedAt = performance.now();
        /* rAF 可能还没轮到，松手必须补发最终值 */
        if (Math.abs(finalScale - lastSent) >= 0.004) {
            lastSent = finalScale;
            requestWindowScale(finalScale);
        }
        holdScale = finalScale;
        paintZoomBadge(finalScale);
        return;
    }
    paintZoomBadge();
}
$('zoomer').addEventListener('pointerup', endZoomDrag);
$('zoomer').addEventListener('pointercancel', endZoomDrag);

/* 双击回 100%；刚拖完 400ms 内忽略，避免「拖完松手」被误判 */
$('zoomer').addEventListener('dblclick', e => {
    e.preventDefault();
    if (performance.now() - dragEndedAt < 400) return;
    lastSent = 1;
    holdScale = 1;
    requestWindowScale(1);
    paintZoomBadge(1);
});

function initZoom() {
    paintZoomBadge();
    lastSent = viewScale();
    /* RO 在布局之后、绘制之前触发，改完 --zoom 直接同一帧画出去，没有中间态 */
    new ResizeObserver(fitToViewport).observe(document.documentElement);
    addEventListener('resize', fitToViewport);
}

/* ---------------- 启动 ---------------- */
initZoom();
buildTicks('ticksRoom');
buildTicks('ticksCut');
buildTicks('ticksGain');
buildDbScales();
buildRings();

$('gaugeRoom').setAttribute('stroke-dasharray', SPAN.toFixed(2) + ' ' + C.toFixed(2));
$('gaugeCut').setAttribute('stroke-dasharray', SPAN.toFixed(2) + ' ' + C.toFixed(2));

placeBall();
setReadout('box_x', X);
setReadout('box_y', Y);
paintWet();
paintKnob('knobRoom', 'roomSize');
paintKnob('knobCut', 'cutoff');
paintKnob('knobGain', 'masterGain');
Cabbage.sendCustomCommand('cabbageIsReadyToLoad', null);

/* ---------------- 手势控制 ----------------
   手往右 = x 变大,手往上 = y 变大;直接驱动雷达中心点。
   手动拖雷达时让位,松手后手势接手。 */
import('./gesture-ui.js').then(({ attachGestureControl }) => {
    attachGestureControl({
        read: () => ({ x: X, y: Y }),
        write: (x, y) => {
            X = x; Y = y;
            placeBall();
            setReadout('box_x', X);
            setReadout('box_y', Y);
        },
        send: (id, v, g) => Cabbage.sendControlData({ channel: id, value: v, gesture: g }, null),
        blocked: () => dragOn.radar || anyDrag(),
    });
}).catch(e => console.warn('Cabbage: 手势模块不可用 —', e));
/* ---------------- 内置使用手册 ----------------
   顶栏 ? 在 iframe 里打开 help.html。只用内嵌:WebView 里 window.open 是死按钮。 */
import('./help-ui.js').then(({ attachHelp }) => attachHelp())
    .catch(e => console.warn('Cabbage: 手册模块不可用 —', e));
</script>
</body>
</html>
