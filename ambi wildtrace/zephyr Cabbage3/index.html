<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cab3-Ambi-Zephyr</title>
<style>
    :root {
        --bg: #060a13;
        --navy: #0f172e;
        --navy2: #16233c;
        --teal: #65d9b8;
        --mint: #c9d5c3;
        --magenta: #c846a0;
        --magenta-soft: rgba(200, 70, 160, .30);
        --dim: rgba(201, 213, 195, .44);
        --faint: rgba(201, 213, 195, .14);
        --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        --lvl: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* html/body 只做视口容器；.canvas 是 620x700 的设计稿，整体靠 --zoom 缩放 */
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
    }

    body {
        --zoom: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .canvas {
        width: 620px;
        height: 700px;
        flex: none;
        transform: scale(var(--zoom));
        transform-origin: center center;
        position: relative;
        overflow: hidden;
        color: var(--mint);
        font-family: -apple-system, "Helvetica Neue", "PingFang SC", Arial, sans-serif;
        font-size: 10px;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        background:
            radial-gradient(ellipse 92% 62% at 50% 22%, #14243f 0%, #0b1425 54%, #060a13 100%);
    }

    /* ---------------- 场景 ---------------- */
    #scene {
        position: absolute;
        left: 0; top: 0;
        width: 620px; height: 450px;
        display: block;
    }

    .hdr {
        position: absolute;
        left: 20px; right: 20px; top: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: none;
        z-index: 4;
    }
    .hdr .mark { display: block; width: 13px; height: 13px; }
    .hdr .mark .ring { fill: none; stroke: rgba(101, 217, 184, .60); stroke-width: 1; }
    .hdr .mark .core { fill: var(--magenta); }
    .hdr h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .5em;
        line-height: 1;
    }
    .hdr .sub {
        font-family: var(--mono);
        font-size: 7px;
        letter-spacing: .26em;
        text-transform: uppercase;
        color: rgba(101, 217, 184, .50);
        padding-top: 2px;
    }
    .hdr .tag {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 7px;
        letter-spacing: .16em;
        color: rgba(101, 217, 184, .62);
        white-space: nowrap;
    }

    /* ---------------- 电平表（dB） ---------------- */

    .metercol {
        position: absolute;
        top: 100px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        z-index: 4;
        pointer-events: none;
    }
    .metercol.l { left: 14px; align-items: flex-start; }
    .metercol.r { right: 14px; align-items: flex-end; }
    .metercol > span {
        height: 8px;
        font-family: var(--mono);
        font-size: 6.5px;
        line-height: 8px;
        letter-spacing: .18em;
        color: rgba(101, 217, 184, .42);
    }
    .meterbody { display: flex; align-items: stretch; gap: 3px; }
    .meterbody.mirror { flex-direction: row-reverse; }

    .bar { position: relative; width: 10px; height: 148px; flex: none; }
    .bar::before, .bar::after {
        content: "";
        position: absolute;
        top: 0; bottom: 0;
        width: 1px;
        background: rgba(101, 217, 184, .13);
    }
    .bar::before { left: 0; }
    .bar::after { right: 0; }
    .bar i {
        position: absolute;
        left: 1px; right: 1px; bottom: 0;
        height: 100%;
        transform-origin: bottom center;
        transform: scaleY(0);
        background: linear-gradient(to top,
            rgba(200, 70, 160, .92) 0%,
            rgba(160, 90, 180, .74) 48%,
            rgba(101, 217, 184, .82) 100%);
        transition: transform .05s linear;
        will-change: transform;
    }
    .bar b {
        position: absolute;
        left: 0; right: 0;
        height: 1px;
        bottom: 0;
        background: rgba(214, 255, 240, .95);
        transition: transform .05s linear, opacity .12s linear;
        opacity: 0;
        will-change: transform;
    }

    .dbscale { position: relative; width: 24px; height: 148px; flex: none; }
    .dbscale .t { position: absolute; left: 0; right: 0; height: 0; }
    .dbscale .t::before {
        content: "";
        position: absolute;
        left: 0; top: 0;
        width: 3px; height: 1px;
        background: rgba(101, 217, 184, .28);
    }
    .dbscale .t.major::before { width: 5px; background: rgba(101, 217, 184, .54); }
    .dbscale .t .n {
        position: absolute;
        right: 0; top: -3.4px;
        font-family: var(--mono);
        font-size: 6px; line-height: 1;
        color: rgba(101, 217, 184, .38);
    }
    .dbscale .t.major .n { color: rgba(101, 217, 184, .62); }
    .dbscale .t.zero .n { color: rgba(214, 255, 240, .88); }
    .meterbody.mirror .dbscale .t::before { left: auto; right: 0; }
    .meterbody.mirror .dbscale .t .n { right: auto; left: 0; }

    /* ---------------- 控制台 ---------------- */
    .deck {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 250px;
        padding: 12px 46px 8px 20px;
        display: flex;
        flex-direction: column;
        background:
            linear-gradient(to bottom, rgba(6, 10, 19, 0) 0%, rgba(6, 10, 19, .80) 10%, #070c16 40%),
            #070c16;
        border-top: 1px solid rgba(101, 217, 184, .14);
        z-index: 6;
    }

    .grow { display: flex; align-items: flex-start; gap: 18px; }
    .grp { flex: none; }
    .gt {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 13px;
        margin-bottom: 3px;
        font-family: var(--mono);
        font-size: 7px;
        letter-spacing: .24em;
        text-transform: uppercase;
        color: rgba(101, 217, 184, .54);
    }
    .gt b {
        font-weight: 400;
        color: rgba(200, 70, 160, .92);
        letter-spacing: .08em;
    }
    .gt::after {
        content: "";
        width: 20px;
        height: 1px;
        background: linear-gradient(to right, rgba(101, 217, 184, .36), transparent);
    }
    .vsep {
        width: 1px;
        align-self: stretch;
        margin: 4px 3px 0;
        background: linear-gradient(to bottom, transparent, rgba(101, 217, 184, .18), transparent);
    }
    .krow { display: flex; gap: 6px; }

    .row2 {
        display: flex;
        align-items: flex-start;
        gap: 26px;
        margin-top: 9px;
    }

    /* ---------------- 旋钮 ---------------- */
    .knob {
        position: relative;
        width: 68px;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: ns-resize;
        touch-action: none;
        padding-top: 1px;
    }
    .knob svg { display: block; width: 50px; height: 50px; overflow: visible; }
    .knob .plate {
        fill: rgba(12, 22, 38, .92);
        stroke: rgba(101, 217, 184, .18);
        stroke-width: 1;
        transition: stroke .16s ease;
    }
    .knob .gauge {
        fill: none;
        stroke: rgba(201, 213, 195, .12);
        stroke-width: 2.2;
        stroke-linecap: round;
    }
    .knob .arc {
        fill: none;
        stroke: var(--magenta);
        stroke-width: 2.2;
        stroke-linecap: round;
        filter: drop-shadow(0 0 3px rgba(200, 70, 160, .55));
        transition: stroke-dasharray .05s linear;
    }
    .knob .tick { stroke: rgba(201, 213, 195, .14); stroke-width: 1; }
    .knob .tick.major { stroke: rgba(101, 217, 184, .46); }
    .knob:hover .plate { stroke: rgba(101, 217, 184, .46); }

    .knob .kval {
        position: absolute;
        left: 50%;
        top: 25px;
        transform: translate(-50%, -50%);
        width: 52px;
        height: 15px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--teal);
        font-family: var(--mono);
        font-size: 9.5px;
        font-weight: 300;
        text-align: center;
        outline: none;
        pointer-events: none;
        -webkit-user-select: text;
        user-select: text;
        -webkit-appearance: none;
        appearance: none;
    }
    .knob.editing { cursor: text; }
    .knob.editing .kval {
        pointer-events: auto;
        background: rgba(101, 217, 184, .12);
        box-shadow: 0 0 0 1px rgba(101, 217, 184, .58);
    }
    .klab {
        margin-top: 3px;
        font-family: var(--mono);
        font-size: 7px;
        line-height: 9px;
        letter-spacing: .18em;
        /* 参数名必须是白的：灰 .54 在 #060a13 上只有约 3:1 对比度，
           缩到 80% 之后基本读不出来 */
        color: #ffffff;
        text-transform: uppercase;
        white-space: nowrap;
    }

    /* ---------------- 走带按钮 ---------------- */
    .trwrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 52px;
        padding-top: 1px;
        flex: none;
    }
    .trwrap .klab {
        margin-top: 3px;
        text-align: center;
        font-size: 6.5px;
        letter-spacing: .14em;
    }
    .btn {
        height: 24px;
        padding: 0;
        border: 1px solid rgba(101, 217, 184, .24);
        border-radius: 2px;
        background: rgba(101, 217, 184, .03);
        color: rgba(255, 255, 255, .78);
        font-family: var(--mono);
        font-size: 6.5px;
        letter-spacing: .13em;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color .14s ease, color .14s ease, background .14s ease, box-shadow .14s ease;
        -webkit-appearance: none;
        appearance: none;
    }
    .btn:hover { border-color: rgba(101, 217, 184, .58); color: #ffffff; }
    .btn.on {
        border-color: rgba(101, 217, 184, .72);
        background: rgba(101, 217, 184, .13);
        color: #d6fff0;
        box-shadow: 0 0 10px rgba(101, 217, 184, .16), inset 0 0 8px rgba(101, 217, 184, .08);
    }
    .btn.on.loop {
        border-color: rgba(200, 70, 160, .72);
        background: rgba(200, 70, 160, .14);
        color: #ffd6ef;
        box-shadow: 0 0 10px rgba(200, 70, 160, .18), inset 0 0 8px rgba(200, 70, 160, .10);
    }

    /* ---------------- 湿声双滑块 ---------------- */
    .wetbox { flex: 1; min-width: 0; padding-top: 15px; }
    .wt {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: var(--mono);
        font-size: 7px;
        letter-spacing: .20em;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 10px;
    }
    /* 右端小字（单位/说明）保持次级，但仍要读得出来 */
    .wt span:last-child { color: rgba(255, 255, 255, .74); letter-spacing: .14em; }

    .dual { position: relative; width: 100%; height: 20px; }
    .dual .ticks {
        position: absolute;
        left: 0; right: 0; top: 50%;
        height: 7px;
        margin-top: -3.5px;
        background: repeating-linear-gradient(90deg,
            rgba(101, 217, 184, .12) 0 1px, transparent 1px 10%);
        pointer-events: none;
    }
    .dual .track {
        position: absolute;
        left: 0; right: 0; top: 50%;
        height: 1px;
        margin-top: -0.5px;
        background: rgba(101, 217, 184, .18);
    }
    .dual .fill {
        position: absolute;
        top: 50%;
        height: 1px;
        margin-top: -0.5px;
        background: var(--magenta);
        box-shadow: 0 0 8px rgba(200, 70, 160, .5);
    }
    .dual .thumb {
        position: absolute;
        top: 50%;
        width: 8px; height: 8px;
        margin-top: -4px;
        margin-left: -4px;
        border-radius: 50%;
        background: #08101d;
        border: 1px solid rgba(101, 217, 184, .58);
        cursor: ew-resize;
        touch-action: none;
        transition: border-color .14s ease, box-shadow .14s ease, transform .1s ease;
    }
    .dual .thumb:hover {
        border-color: var(--magenta);
        box-shadow: 0 0 0 3px rgba(200, 70, 160, .10), 0 0 10px rgba(200, 70, 160, .40);
    }
    .dual .thumb:active { transform: scale(1.14); }

    .vals {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 7.5px;
        letter-spacing: .06em;
        color: var(--teal);
    }
    .vals input {
        width: 46px;
        padding: 1px 3px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--teal);
        font: inherit;
        letter-spacing: inherit;
        text-align: left;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
        -webkit-appearance: none;
        appearance: none;
    }
    .vals input:last-child { text-align: right; }
    .vals input:focus {
        background: rgba(101, 217, 184, .12);
        box-shadow: 0 0 0 1px rgba(101, 217, 184, .58);
    }

    /* ---------------- 底栏 ---------------- */
    .foot {
        margin-top: auto;
        padding-top: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 6.5px;
        letter-spacing: .26em;
        text-transform: uppercase;
        color: rgba(101, 217, 184, .66);
    }
    .foot .cell { letter-spacing: .16em; color: rgba(255, 255, 255, .82); }

    /* ---------------- 缩放三角（右下角） ---------------- */
    .zoomer {
        position: absolute;
        right: 0; bottom: 0;
        width: 34px; height: 34px;
        padding: 0;
        border: 0;
        background: none;
        cursor: ns-resize;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        z-index: 20;
    }
    .zoomer svg { display: block; width: 14px; height: 14px; margin: 0 4px 4px 0; }
    .zoomer path { fill: rgba(101, 217, 184, .40); transition: fill .14s ease; }
    .zoomer:hover path { fill: rgba(101, 217, 184, .94); }
    .zoomer[data-host="accepted"] path { fill: rgba(101, 217, 184, .64); }
    .zoomer[data-host="rejected"] path {
        fill: none;
        stroke: rgba(101, 217, 184, .50);
        stroke-width: 1.1;
    }
    .zoomer[data-host="rejected"]:hover path { stroke: rgba(101, 217, 184, .92); fill: none; }
    .zoomer:active path { fill: var(--magenta); }
    .zoomer .zpct {
        position: absolute;
        right: 21px; bottom: 4px;
        font-family: var(--mono);
        font-size: 6.5px;
        letter-spacing: .10em;
        color: rgba(101, 217, 184, .64);
        opacity: 0;
        transition: opacity .14s ease;
        pointer-events: none;
        white-space: nowrap;
    }
    .zoomer:hover .zpct { opacity: 1; }
    body.dragging-zoom .zoomer .zpct { opacity: 1; }

    /* ---------------- 场景元素 ---------------- */
    .ring { fill: none; stroke: rgba(101, 217, 184, .13); stroke-width: 1; }
    .ring.major { stroke: rgba(101, 217, 184, .26); }
    .axis { stroke: rgba(101, 217, 184, .16); stroke-width: 1; }
    .axis.dash { stroke-dasharray: 2 5; stroke: rgba(101, 217, 184, .13); }
    .frame { fill: none; stroke: rgba(101, 217, 184, .34); stroke-width: 1; }
    .padfill { fill: rgba(101, 217, 184, .012); }

    .pathline { fill: none; stroke: rgba(232, 120, 190, .70); stroke-width: 1.2; stroke-dasharray: 5 7; }
    .corridor { fill: rgba(101, 217, 184, .055); stroke: rgba(101, 217, 184, .16); stroke-width: .8; stroke-dasharray: 2 5; }

    .ret-ring { fill: none; stroke: rgba(200, 70, 160, .85); stroke-width: 1; }
    .ret-tick { stroke: rgba(255, 214, 239, .9); stroke-width: 1; }
    .ret-core { fill: #ffe6f6; }

    .trail-shadow { fill: #060a13; }
    .env-ring { fill: none; stroke: rgba(200, 70, 160, .55); stroke-width: 1; }

    /* ===== 4 声道电平表：与 Quad 逐字一致 =====
       固定高度带 + space-between 把两个表推到两端，
       再把 .bar/.dbscale 高度覆盖成能塞进带内的值，避免压到下方控件。 */
    .mside {
        position: absolute;
        top: 104px;
        height: 326px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 4;
        pointer-events: none;
    }
    .mside.l { left: 14px; align-items: flex-start; }
    .mside.r { right: 14px; align-items: flex-end; }
    .mside .metercol { position: static; top: auto; }
</style>
</head>
<body>

<div class="canvas" id="canvas">

    <svg id="scene" viewBox="0 0 620 450" aria-hidden="true">
        <defs>
            <radialGradient id="bgGrad" cx="50%" cy="40%" r="76%">
                <stop offset="0%" stop-color="#14243f"/>
                <stop offset="56%" stop-color="#0c1626"/>
                <stop offset="100%" stop-color="#060a13"/>
            </radialGradient>

            <pattern id="mesh" width="7" height="7" patternUnits="userSpaceOnUse">
                <path d="M0 0H7M0 0V7" stroke="rgba(101,217,184,.035)" stroke-width=".7"/>
            </pattern>

            <radialGradient id="vign" cx="50%" cy="44%" r="66%">
                <stop offset="0%" stop-color="#000" stop-opacity="0"/>
                <stop offset="72%" stop-color="#000" stop-opacity=".16"/>
                <stop offset="100%" stop-color="#000" stop-opacity=".62"/>
            </radialGradient>

            <linearGradient id="fadeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="392" x2="0" y2="450">
                <stop offset="0%" stop-color="#070c16" stop-opacity="0"/>
                <stop offset="100%" stop-color="#070c16" stop-opacity="1"/>
            </linearGradient>

            <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ff7ad0" stop-opacity=".40"/>
                <stop offset="44%" stop-color="#c846a0" stop-opacity=".16"/>
                <stop offset="100%" stop-color="#c846a0" stop-opacity="0"/>
            </radialGradient>

            <radialGradient id="lvlGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#65d9b8" stop-opacity=".22"/>
                <stop offset="58%" stop-color="#3f9fb0" stop-opacity=".07"/>
                <stop offset="100%" stop-color="#3f9fb0" stop-opacity="0"/>
            </radialGradient>

            <linearGradient id="trailGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="10" y2="0">
                <stop offset="0%" stop-color="#ffd6ef" stop-opacity="0"/>
                <stop offset="42%" stop-color="#f19ad2" stop-opacity=".26"/>
                <stop offset="76%" stop-color="#e264b8" stop-opacity=".68"/>
                <stop offset="100%" stop-color="#ffeaf8" stop-opacity="1"/>
            </linearGradient>

            <!-- ★ region 用 userSpaceOnUse 绝对范围，百分比会被细长包围盒裁成方形 -->
            <filter id="trailBlurS" filterUnits="userSpaceOnUse"
                    x="-40" y="-40" width="700" height="530">
                <feGaussianBlur stdDeviation="2.2"/>
            </filter>
            <filter id="trailBlurL" filterUnits="userSpaceOnUse"
                    x="-40" y="-40" width="700" height="530">
                <feGaussianBlur stdDeviation="5.5"/>
            </filter>

            <clipPath id="padClip">
                <rect id="padClipRect" x="145" y="58" width="330" height="330"/>
            </clipPath>
        </defs>

        <rect x="0" y="0" width="620" height="450" fill="url(#bgGrad)"/>
        <rect x="0" y="0" width="620" height="450" fill="url(#mesh)" opacity=".8"/>
        <rect id="lvlWash" x="120" y="36" width="380" height="390"
              fill="url(#lvlGrad)" opacity="0" pointer-events="none"/>

        <rect class="padfill" id="padFill" pointer-events="none" x="145" y="58" width="330" height="330"/>
        <g id="radar" pointer-events="none"></g>
        <rect class="frame" id="frame" pointer-events="none" x="145" y="58" width="330" height="330"/>

        <!-- 湍流走廊：垂直于运动方向的半透明带，宽度随 drift + jitter 变 -->
        <g clip-path="url(#padClip)">
            <rect class="corridor" id="corridor" x="0" y="0" width="0" height="0" pointer-events="none"/>
            <line class="pathline" id="pathLine" x1="0" y1="0" x2="0" y2="0" pointer-events="none"/>

            <path id="trailShadow" class="trail-shadow" opacity="0" pointer-events="none" filter="url(#trailBlurS)"/>
            <path id="trailGlow" fill="#c846a0" opacity="0" pointer-events="none" filter="url(#trailBlurL)"/>
            <path id="trailLine" fill="url(#trailGrad)" opacity="0" pointer-events="none"/>
        </g>

        <!-- 振幅门包络：会随 zep_env 呼吸的一圈 -->
        <circle class="env-ring" id="envRing" cx="310" cy="223" r="14" opacity="0" pointer-events="none"/>

        <!-- 目标准星：整体随 angle 旋转 -->
        <g id="reticle" opacity="0" pointer-events="none">
            <circle r="16" fill="url(#ballGlow)"/>
            <circle class="ret-ring" r="6.4"/>
            <line class="ret-tick" x1="0" y1="-11.5" x2="0" y2="-8.6"/>
            <line class="ret-tick" x1="0" y1="8.6" x2="0" y2="11.5"/>
            <line class="ret-tick" x1="-11.5" y1="0" x2="-8.6" y2="0"/>
            <line class="ret-tick" x1="8.6" y1="0" x2="11.5" y2="0"/>
            <circle class="ret-core" r="1.7"/>
        </g>

        <rect x="0" y="392" width="620" height="58" fill="url(#fadeGrad)" pointer-events="none"/>
        <rect x="0" y="0" width="620" height="450" fill="url(#vign)" pointer-events="none"/>
    </svg>

    <div class="hdr">
        <svg class="mark" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="width:13px;height:13px;flex:none;display:block">

<script type="module">
import { Cabbage } from './cabbage/cabbage.js';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
/* 把归一化坐标钳制到圆盘内（圆盘半径 0.5，圆心 0.5,0.5） */
const clampDisc01 = (x, y) => {
    const dx = x - 0.5, dy = y - 0.5, d = Math.hypot(dx, dy);
    if (d <= 0.5 || d === 0) return [x, y];
    return [0.5 + dx / d * 0.5, 0.5 + dy / d * 0.5];
};
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ---------------- 参数表 ----------------
   min / max / def 必须与 CSD 的 <Cabbage> 逐项一致（def = defaultValue，双击归位回到它）。
   curve 是纯前端手感（§6.16），不写进 CSD：
     fallTime 0.1~600（3.8 个数量级）→ 7；dfreq 0.01~10（1000×）→ 4；
     roomSize 10~100 → 1；cutoff 1000~16000 → 3；其余有界比例量线性。 */
const P = {
    fallTime: { min: 0.1,  max: 600,   curve: 7, step: 0.01,  def: 2,     fmt: v => v < 10 ? v.toFixed(2) : (v < 100 ? v.toFixed(1) : String(Math.round(v))) },
    angle:    { min: 0,    max: 360,   curve: 0, step: 1,     def: 90,    fmt: v => String(Math.round(v)) },
    radius:   { min: 0,    max: 0.5,   curve: 0, step: 0.001, def: 0.353, fmt: v => v.toFixed(3) },
    drift:    { min: 0,    max: 0.5,   curve: 0, step: 0.001, def: 0.1,   fmt: v => v.toFixed(3) },
    dfreq:    { min: 0.01, max: 10,    curve: 4, step: 0.01,  def: 0.2,   fmt: v => v < 1 ? v.toFixed(2) : v.toFixed(1) },
    jitter:   { min: 0,    max: 0.2,   curve: 0, step: 0.001, def: 0.02,  fmt: v => v.toFixed(3) },
    roomSize: { min: 10,   max: 100,   curve: 1, step: 0.1,   def: 50,    fmt: v => String(Math.round(v)) },
    cutoff:   { min: 1000, max: 16000, curve: 3, step: 1,     def: 16000,  fmt: v => String(Math.round(v)) },
    masterGain: { min: 0,  max: 8,     curve: 0, step: 0.01,  def: 2,      fmt: v => v.toFixed(2) }
};

const V = {
    fallTime: 2, angle: 90, radius: 0.353,
    drift: 0.1, dfreq: 0.2, jitter: 0.02,
    roomSize: 50, cutoff: 16000, masterGain: 2
};

const WET_DEF = { minWet: 0.1, maxWet: 0.6 };
let minWet = 0.1, maxWet = 0.6;
let running = true, looping = true;

/* 必须与 CSD 中 automatable:true widget 的书写顺序逐字一致 */
const PARAM_IDX = ['Start', 'Loop', 'fallTime', 'angle', 'radius',
                   'drift', 'dfreq', 'jitter', 'minWet', 'maxWet', 'roomSize', 'cutoff', 'masterGain'];

const dragOn = {
    fallTime: false, angle: false, radius: false,
    drift: false, dfreq: false, jitter: false,
    roomSize: false, cutoff: false, masterGain: false, wet: null, zoom: false
};

/* ---------------- 旋钮映射曲线（§6.16） ---------------- */
const KB = { r: 22, span: 0.75 };
const CIRC = 2 * Math.PI * KB.r;
const SPAN = CIRC * KB.span;

const CURVE_MAX_K = 12;
const curveToNorm = (f, k) => {
    if (!k) return f;
    const K = Math.min(Math.abs(k), CURVE_MAX_K), A = Math.exp(K) - 1;
    return k > 0 ? (Math.exp(K * f) - 1) / A
                 : 1 - (Math.exp(K * (1 - f)) - 1) / A;
};
const normToCurve = (n, k) => {
    if (!k) return n;
    const K = Math.min(Math.abs(k), CURVE_MAX_K), A = Math.exp(K) - 1;
    return k > 0 ? Math.log(1 + n * A) / K
                 : 1 - Math.log(1 + (1 - n) * A) / K;
};

const toFrac   = (v, p) => normToCurve(clamp((v - p.min) / (p.max - p.min), 0, 1), p.curve || 0);
const fromFrac = (f, p) => p.min + (p.max - p.min) * curveToNorm(clamp(f, 0, 1), p.curve || 0);

/* ---------------- 场景几何 ----------------
   pad 固定不动（见模板 §9「改行列数时 pad 跟着变大变小」的同类坑）：
   后端送的是同一块 pad 里的归一化位置，参数只改变图形本身。 */
const PAD = { x: 145, y: 58, w: 330, h: 330 };
const CX = PAD.x + PAD.w / 2;
const CY = PAD.y + PAD.h / 2;

/* 归一化坐标 → 屏幕坐标（Y 轴向上，与 Csound 一致） */
const toScreen = (x, y) => {
    const [cx, cy] = clampDisc01(clamp(x, 0, 1), clamp(y, 0, 1));
    return {
        x: PAD.x + cx * PAD.w,
        y: PAD.y + (1 - cy) * PAD.h
    };
};

const svgEl = (name, attrs) => {
    const el = document.createElementNS(NS, name);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
};

function buildRadar() {
    const g = $('radar');
    g.innerHTML = '';
    for (const f of [0.25, 0.5, 0.75, 1]) {
        const r = (PAD.w / 2) * f;
        g.appendChild(svgEl('circle', {
            class: f === 1 ? 'ring major' : 'ring',
            cx: CX, cy: CY, r: r.toFixed(2)
        }));
    }
    for (const a of [45, 135]) {
        const d = (PAD.w / 2) * Math.SQRT1_2 * 2;
        const rad = a * Math.PI / 180;
        g.appendChild(svgEl('line', {
            class: 'axis dash',
            x1: (CX - Math.cos(rad) * d).toFixed(2), y1: (CY - Math.sin(rad) * d).toFixed(2),
            x2: (CX + Math.cos(rad) * d).toFixed(2), y2: (CY + Math.sin(rad) * d).toFixed(2)
        }));
    }
    g.appendChild(svgEl('line', {
        class: 'axis', x1: PAD.x, y1: CY, x2: PAD.x + PAD.w, y2: CY
    }));
    g.appendChild(svgEl('line', {
        class: 'axis', x1: CX, y1: PAD.y, x2: CX, y2: PAD.y + PAD.h
    }));
}

/* 运动方向（屏幕坐标，Y 向下 → sin 取负） */
function dirVec() {
    const a = V.angle * Math.PI / 180;
    return { x: Math.cos(a), y: -Math.sin(a) };
}

/* 轨迹半长：Csound 里 kMaxRad = radius*1.4142，movement = ±kMaxRad */
const pathHalf = () => V.radius * 1.4142 * PAD.w;

/* 走廊半宽：横向偏移 = (drift + jitter) 归一化单位 */
const corridorHalf = () => (V.drift + V.jitter) * PAD.w;

function paintGuide() {
    const d = dirVec();
    const L = pathHalf();

    const ln = $('pathLine');
    ln.setAttribute('x1', (CX - d.x * L).toFixed(2));
    ln.setAttribute('y1', (CY - d.y * L).toFixed(2));
    ln.setAttribute('x2', (CX + d.x * L).toFixed(2));
    ln.setAttribute('y2', (CY + d.y * L).toFixed(2));

    /* 走廊：长边必须对齐运动方向，短边才是横向幅度。
       rect 长边沿本地 x 轴 → rotate(-angle) 把 x 轴转到 (cos a, -sin a)。 */
    const w = corridorHalf() * 2;
    const c = $('corridor');
    c.setAttribute('x', '-400');
    c.setAttribute('y', (-corridorHalf()).toFixed(2));
    c.setAttribute('width', '800');
    c.setAttribute('height', w.toFixed(2));
    c.setAttribute('transform', 'translate(' + CX + ' ' + CY + ') rotate(' + (-V.angle).toFixed(2) + ')');

    $('geoTag').textContent = 'ANGLE ' + String(Math.round(V.angle)).padStart(3, '0') + '° · R ' + V.radius.toFixed(3);
}

/* ---------------- 梭子 + 拖尾（§6.17） ---------------- */
const trail = [];
let lastMarker = null;
let posX = 0.5, posY = 0.5;
let env = 0;

const TRAIL_LEN = 64;

function hideTrail() {
    $('trailLine').setAttribute('opacity', '0');
    $('trailGlow').setAttribute('opacity', '0');
    $('trailShadow').setAttribute('opacity', '0');
}

function trimTrail() {
    let acc = 0, i = trail.length - 1;
    while (i > 0) {
        acc += Math.hypot(trail[i].x - trail[i - 1].x, trail[i].y - trail[i - 1].y);
        if (acc > TRAIL_LEN) break;
        i--;
    }
    if (i > 0) trail.splice(0, i);
}

function chaikin(pts, iters) {
    let p = pts;
    for (let k = 0; k < iters; k++) {
        if (p.length < 3) return p;
        const out = [p[0]];
        for (let i = 0; i < p.length - 1; i++) {
            const a = p[i], b = p[i + 1];
            out.push({ x: a.x * 0.75 + b.x * 0.25, y: a.y * 0.75 + b.y * 0.25 });
            out.push({ x: a.x * 0.25 + b.x * 0.75, y: a.y * 0.25 + b.y * 0.75 });
        }
        out.push(p[p.length - 1]);
        p = out;
    }
    return p;
}

/* 沿平滑折线生成锥形带：尾端宽度 0，头端宽度 wMax */
function ribbonPath(pts, wMax) {
    const n = pts.length, f = v => v.toFixed(1);
    if (n < 2) return '';
    const left = [], right = [];
    for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        const w = wMax * Math.pow(t, 1.15);
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
        let dx = b.x - a.x, dy = b.y - a.y;
        const L = Math.hypot(dx, dy) || 1;
        dx /= L; dy /= L;
        left.push([pts[i].x - dy * w, pts[i].y + dx * w]);
        right.push([pts[i].x + dy * w, pts[i].y - dx * w]);
    }
    let d = 'M' + f(left[0][0]) + ' ' + f(left[0][1]);
    for (let i = 1; i < n; i++) d += ' L' + f(left[i][0]) + ' ' + f(left[i][1]);
    for (let i = n - 1; i >= 0; i--) d += ' L' + f(right[i][0]) + ' ' + f(right[i][1]);
    return d + ' Z';
}

function drawTrail() {
    if (trail.length < 3) { hideTrail(); return; }
    const pts = chaikin(trail, 2);
    const w = 1.5 + (V.jitter / 0.2) * 0.6;

    $('trailLine').setAttribute('d', ribbonPath(pts, w));
    $('trailShadow').setAttribute('d', ribbonPath(pts, w * 1.4));
    $('trailGlow').setAttribute('d', ribbonPath(pts, w * 2.2));

    const a = trail[0], b = trail[trail.length - 1];
    const grad = document.getElementById('trailGrad');
    grad.setAttribute('x1', a.x.toFixed(1));
    grad.setAttribute('y1', a.y.toFixed(1));
    grad.setAttribute('x2', b.x.toFixed(1));
    grad.setAttribute('y2', b.y.toFixed(1));

    $('trailLine').setAttribute('opacity', '1');
    $('trailShadow').setAttribute('opacity', '0.32');
    $('trailGlow').setAttribute('opacity', (0.12 + env * 0.16).toFixed(2));
}

function placeReticle(p) {
    const g = $('reticle');
    g.setAttribute('transform',
        'translate(' + p.x.toFixed(2) + ' ' + p.y.toFixed(2) + ') rotate(' + (-V.angle).toFixed(1) + ')');
    g.setAttribute('opacity', running ? '1' : '.55');

    const ring = $('envRing');
    ring.setAttribute('cx', p.x.toFixed(2));
    ring.setAttribute('cy', p.y.toFixed(2));
    ring.setAttribute('r', (13 + env * 15).toFixed(2));
    ring.setAttribute('opacity', (env * 0.85).toFixed(3));
}

/* ---------------- 坐标合并到同一帧（§6.11） ---------------- */
let pendX = null, pendY = null, markerRaf = 0;

function queueMarker(x, y) {
    if (x != null) pendX = x;
    if (y != null) pendY = y;
    if (markerRaf) return;
    markerRaf = requestAnimationFrame(() => {
        markerRaf = 0;
        if (pendX == null && pendY == null) return;
        const nx = pendX == null ? posX : pendX;
        const ny = pendY == null ? posY : pendY;
        pendX = pendY = null;
        updateMarker(nx, ny);
    });
}

function updateMarker(x, y) {
    posX = clamp(x, 0, 1);
    posY = clamp(y, 0, 1);
    const p = toScreen(posX, posY);

    const moved = !lastMarker || Math.hypot(p.x - lastMarker.x, p.y - lastMarker.y) > 0.25;
    if (moved) {
        /* 相位重置会瞬移：一帧跨过很远就斩断拖尾，避免拉出一条横穿画面的直线 */
        const prev = trail[trail.length - 1];
        if (prev && Math.hypot(p.x - prev.x, p.y - prev.y) > 90) trail.length = 0;
        trail.push(p);
        if (trail.length > 48) trail.shift();
        trimTrail();
        lastMarker = p;
    }
    drawTrail();
    placeReticle(p);
}

/* ---------------- 走带 ---------------- */
function paintTransport() {
    const bs = $('btnStart');
    bs.textContent = running ? 'Stop' : 'Start';
    bs.classList.toggle('on', running);

    const bl = $('btnLoop');
    bl.textContent = looping ? 'Loop On' : 'Loop Off';
    bl.classList.toggle('on', looping);
    bl.classList.toggle('loop', looping);
}

$('btnStart').addEventListener('click', () => {
    running = !running;
    paintTransport();
    Cabbage.sendControlData({ channel: 'Start', value: running ? 1 : 0, gesture: 'complete' }, null);
});

$('btnLoop').addEventListener('click', () => {
    looping = !looping;
    paintTransport();
    Cabbage.sendControlData({ channel: 'Loop', value: looping ? 1 : 0, gesture: 'complete' }, null);
});

/* ---------------- 旋钮 ---------------- */
const KNOB_IDS = {
    fallTime: { arc: 'aFall',   txt: 'vFall' },
    angle:    { arc: 'aAngle',  txt: 'vAngle' },
    radius:   { arc: 'aRadius', txt: 'vRadius' },
    drift:    { arc: 'aDrift',  txt: 'vDrift' },
    dfreq:    { arc: 'aDfreq',  txt: 'vDfreq' },
    jitter:   { arc: 'aJitter', txt: 'vJitter' },
    roomSize: { arc: 'aRoom',   txt: 'vRoom' },
    cutoff:   { arc: 'aDamp',   txt: 'vDamp' },
    masterGain: { arc: 'aGain', txt: 'vGain' }
};

function buildTicks(groupId) {
    const g = $(groupId);
    for (let i = 0; i <= 20; i++) {
        const f = i / 20;
        const deg = 225 + f * 270;
        const rad = deg * Math.PI / 180;
        const major = i % 5 === 0;
        const r1 = major ? 24.6 : 25.2;
        const r2 = 27.4;
        g.appendChild(svgEl('line', {
            x1: (27 + r1 * Math.sin(rad)).toFixed(2),
            y1: (27 - r1 * Math.cos(rad)).toFixed(2),
            x2: (27 + r2 * Math.sin(rad)).toFixed(2),
            y2: (27 - r2 * Math.cos(rad)).toFixed(2),
            class: major ? 'tick major' : 'tick'
        }));
    }
}

function setParam(key, v) {
    V[key] = v;
    if (key === 'angle' || key === 'radius' || key === 'drift' || key === 'jitter') paintGuide();
}

function paintKnob(key) {
    const p = P[key];
    const v = V[key];
    const f = toFrac(clamp(v, p.min, p.max), p);
    const ids = KNOB_IDS[key];
    $(ids.arc).setAttribute('stroke-dasharray',
        (f * SPAN).toFixed(2) + ' ' + CIRC.toFixed(2));
    if (editing.key === key) return;
    $(ids.txt).value = p.fmt(v);
}

/* ---------------- 数值编辑（§6.8） ---------------- */
const DBL_MS = 350;
const editing = { key: null, el: null, knob: null };
let lastTapAt = 0, lastTapKey = null;

function parseNum(raw, p) {
    let t = String(raw).trim().toLowerCase().replace(/\s+/g, '');
    if (!t) return NaN;
    let mul = 1;
    if (t.endsWith('k')) { mul = 1000; t = t.slice(0, -1); }
    else if (t.endsWith('hz')) { t = t.slice(0, -2); }
    else if (t.endsWith('°')) { t = t.slice(0, -1); }
    const n = parseFloat(t);
    if (!isFinite(n)) return NaN;
    const v = n * mul;
    return clamp(Math.round(v / p.step) * p.step, p.min, p.max);
}

function openEditor(key) {
    const el = $(KNOB_IDS[key].txt);
    if (editing.el === el) { el.select(); return; }
    closeEditor(true);
    editing.key = key;
    editing.el = el;
    editing.knob = el.closest('.knob');
    if (editing.knob) editing.knob.classList.add('editing');
    el.value = P[key].fmt(V[key]);
    el.focus();
    el.select();
}

function closeEditor(silent) {
    const el = editing.el;
    if (!el) return;
    const wasKey = editing.key;
    editing.key = null;
    editing.el = null;
    if (editing.knob) editing.knob.classList.remove('editing');
    editing.knob = null;
    if (!silent) {
        el.blur();
        if (wasKey) paintKnob(wasKey);
    }
}

function commitEdit() {
    const key = editing.key;
    if (!key) return;
    const el = editing.el;
    const v = parseNum(el.value, P[key]);
    closeEditor();
    if (!isFinite(v)) { paintKnob(key); return; }
    setParam(key, v);
    paintKnob(key);
    Cabbage.sendControlData({ channel: key, value: v, gesture: 'complete' }, null);
}

function resetKnob(key) {
    const d = P[key].def;
    setParam(key, d);
    paintKnob(key);
    Cabbage.sendControlData({ channel: key, value: d, gesture: 'complete' }, null);
}

function bindKnob(elId, key) {
    const el = $(elId);
    const p = P[key];
    const txt = $(KNOB_IDS[key].txt);
    let startY = 0, startX = 0, accF = 0, lastY = 0;
    let dragging = false, active = false, onInput = false, moved = false;

    el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        /* 点到另一个旋钮时，先把上一个正在编辑的值提交掉 */
        if (editing.key && editing.key !== key) commitEdit();
        active = true;
        dragging = false;
        onInput = (e.target === txt);
        startX = e.clientX;
        moved = false;
        startY = e.clientY;
        lastY = e.clientY;
        accF = toFrac(clamp(V[key], p.min, p.max), p);
        if (!onInput) {
            el.setPointerCapture(e.pointerId);
            e.preventDefault();
        }
    });

    el.addEventListener('pointermove', e => {
        if (!active) return;
        if (onInput) {
            if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) moved = true;
            return;
        }
        const dy = startY - e.clientY;
        if (!dragging) {
            if (Math.abs(dy) < 3) return;
            dragging = true;
            dragOn[key] = true;
            closeEditor(true);
            Cabbage.sendControlData({ channel: key, value: V[key], gesture: 'begin' }, null);
        }
        e.preventDefault();
        /* Shift 精调：按每帧增量累加（中途按 Shift 不会跳变） */
        accF = clamp(accF + (lastY - e.clientY) / (e.shiftKey ? 750 : 150), 0, 1);
        lastY = e.clientY;
        let v = fromFrac(accF, p);
        v = clamp(Math.round(v / p.step) * p.step, p.min, p.max);
        setParam(key, v);
        paintKnob(key);
        Cabbage.sendControlData({ channel: key, value: v, gesture: 'value' }, null);
    });

    const up = e => {
        if (!active) return;
        active = false;
        const wasInput = onInput;
        const wasMoved = moved;
        onInput = false;
        moved = false;
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}
        if (dragging) {
            dragging = false;
            dragOn[key] = false;
            Cabbage.sendControlData({ channel: key, value: V[key], gesture: 'end' }, null);
            return;
        }
        if (wasMoved) { lastTapAt = 0; lastTapKey = null; return; }

        const now = performance.now();
        if (lastTapKey === key && now - lastTapAt < DBL_MS) {
            lastTapAt = 0; lastTapKey = null;
            closeEditor();
            resetKnob(key);
            return;
        }
        lastTapAt = now; lastTapKey = key;
        if (!wasInput) openEditor(key);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('contextmenu', e => e.preventDefault());

    txt.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); commitEdit(); }
        else if (e.key === 'Escape') { e.preventDefault(); closeEditor(); paintKnob(key); }
    });
    txt.addEventListener('blur', () => { if (editing.key === key) commitEdit(); });
    txt.addEventListener('dblclick', e => {
        e.preventDefault(); e.stopPropagation();
        closeEditor();
        resetKnob(key);
    });
}

/* ---------------- 湿声发送 ---------------- */
function paintWet() {
    const w = $('dual').clientWidth;
    const l = minWet * w, r = maxWet * w;
    $('wetRange').style.left = l + 'px';
    $('wetRange').style.width = Math.max(0, r - l) + 'px';
    $('thumbMin').style.left = l + 'px';
    $('thumbMax').style.left = r + 'px';
    paintWetOut();
}

const wetEditing = { key: null };
function paintWetOut() {
    if (wetEditing.key !== 'minWet') $('wetMinOut').value = minWet.toFixed(2);
    if (wetEditing.key !== 'maxWet') $('wetMaxOut').value = maxWet.toFixed(2);
}

function bindWetField(id, key) {
    const el = $(id);
    const p = { min: 0, max: 1, step: 0.01 };

    const commit = () => {
        if (wetEditing.key !== key) return;
        wetEditing.key = null;
        const v = parseNum(el.value, p);
        if (!isFinite(v)) { paintWetOut(); return; }
        if (key === 'minWet') minWet = clamp(v, 0, Math.max(0, maxWet - 0.02));
        else maxWet = clamp(v, Math.min(1, minWet + 0.02), 1);
        paintWet();
        Cabbage.sendControlData({ channel: key, value: key === 'minWet' ? minWet : maxWet, gesture: 'complete' }, null);
    };

    el.addEventListener('focus', () => { wetEditing.key = key; el.select(); });
    el.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); commit(); el.blur(); }
        else if (e.key === 'Escape') { e.preventDefault(); wetEditing.key = null; paintWetOut(); el.blur(); }
    });
    el.addEventListener('blur', commit);
    el.addEventListener('pointerdown', e => e.stopPropagation());
    el.addEventListener('dblclick', e => {
        e.preventDefault();
        wetEditing.key = null;
        if (key === 'minWet') minWet = WET_DEF.minWet;
        else maxWet = WET_DEF.maxWet;
        paintWet();
        el.blur();
        Cabbage.sendControlData({ channel: key, value: key === 'minWet' ? minWet : maxWet, gesture: 'complete' }, null);
    });
}

const wetFrom = e => {
    const box = $('dual').getBoundingClientRect();
    const f = clamp((e.clientX - box.left) / box.width, 0, 1);
    if (dragOn.wet === 'min') minWet = Math.min(f, maxWet - 0.02);
    else maxWet = Math.max(f, minWet + 0.02);
    paintWet();
    return dragOn.wet === 'min' ? minWet : maxWet;
};

function bindThumb(id, which) {
    const el = $(id);
    const ch = which === 'min' ? 'minWet' : 'maxWet';
    el.addEventListener('pointerdown', e => {
        if (editing.key) commitEdit();
        dragOn.wet = which;
        el.setPointerCapture(e.pointerId);
        e.preventDefault();
        Cabbage.sendControlData({ channel: ch, value: wetFrom(e), gesture: 'begin' }, null);
    });
    el.addEventListener('pointermove', e => {
        if (dragOn.wet !== which) return;
        Cabbage.sendControlData({ channel: ch, value: wetFrom(e), gesture: 'value' }, null);
    });
    const up = () => {
        if (dragOn.wet !== which) return;
        dragOn.wet = null;
        Cabbage.sendControlData({ channel: ch, value: which === 'min' ? minWet : maxWet, gesture: 'end' }, null);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
}

/* ---------------- 电平表 ---------------- */
const METER_H = 148;
const DB_MIN = -60;
const DB_TICKS = [0, -6, -12, -18, -24, -30, -40, -50, -60];

const ampToDb = a => 20 * Math.log10(Math.max(Math.abs(a), 1e-6));
const dbToPos = db => clamp((db - DB_MIN) / (0 - DB_MIN), 0, 1);

function buildDbScales() {
    for (const id of ['scaleFL', 'scaleFR', 'scaleRL', 'scaleRR']) {
        const el = $(id);
        el.innerHTML = '';
        for (const db of DB_TICKS) {
            const t = document.createElement('div');
            t.className = 't' + (db === 0 ? ' zero' : '') + (db % 12 === 0 ? ' major' : '');
            t.style.bottom = (dbToPos(db) * 100).toFixed(3) + '%';
            const n = document.createElement('span');
            n.className = 'n';
            n.textContent = db === 0 ? '0' : String(db);
            t.appendChild(n);
            el.appendChild(t);
        }
    }
}

function setMeter(id, capId, amp) {
    const db = clamp(ampToDb(amp), DB_MIN, 0);
    const pos = dbToPos(db);
    $(id).style.transform = 'scaleY(' + pos.toFixed(4) + ')';
    const cap = $(capId);
    cap.style.transform = 'translateY(' + (-pos * METER_H).toFixed(1) + 'px)';
    cap.style.opacity = pos > 0.002 ? '.95' : '0';
}

function updateGlow(l, r) {
    const lv = clamp(Math.max(l, r), 0, 1);
    document.documentElement.style.setProperty('--lvl', lv.toFixed(3));
    $('lvlWash').setAttribute('opacity', (0.04 + lv * 0.5).toFixed(3));
}

/* ---------------- 接收后端 ---------------- */
let lvlL = 0, lvlR = 0, lvlRL = 0, lvlRR = 0;

function applyValue(id, v) {
    if (typeof v !== 'number' || isNaN(v)) return;
    switch (id) {
        case 'zep_x':
            queueMarker(v, null);
            break;
        case 'zep_y':
            queueMarker(null, v);
            break;
        case 'zep_env':
            env = clamp(v, 0, 1);
            $('envTag').textContent = 'ENV ' + String(Math.round(env * 100)).padStart(2, '0') + '%';
            placeReticle(toScreen(posX, posY));
            break;
        case 'Start':
            running = v >= 0.5;
            paintTransport();
            break;
        case 'Loop':
            looping = v >= 0.5;
            paintTransport();
            break;
        case 'fallTime':
            if (dragOn.fallTime) break;
            V.fallTime = clamp(v, P.fallTime.min, P.fallTime.max);
            paintKnob('fallTime');
            break;
        case 'angle':
            if (dragOn.angle) break;
            V.angle = clamp(v, P.angle.min, P.angle.max);
            paintKnob('angle'); paintGuide();
            break;
        case 'radius':
            if (dragOn.radius) break;
            V.radius = clamp(v, P.radius.min, P.radius.max);
            paintKnob('radius'); paintGuide();
            break;
        case 'drift':
            if (dragOn.drift) break;
            V.drift = clamp(v, P.drift.min, P.drift.max);
            paintKnob('drift'); paintGuide();
            break;
        case 'dfreq':
            if (dragOn.dfreq) break;
            V.dfreq = clamp(v, P.dfreq.min, P.dfreq.max);
            paintKnob('dfreq');
            break;
        case 'jitter':
            if (dragOn.jitter) break;
            V.jitter = clamp(v, P.jitter.min, P.jitter.max);
            paintKnob('jitter'); paintGuide();
            break;
        case 'minWet':
            if (dragOn.wet === 'min') break;
            minWet = clamp(v, 0, 1);
            paintWet();
            break;
        case 'maxWet':
            if (dragOn.wet === 'max') break;
            maxWet = clamp(v, 0, 1);
            paintWet();
            break;
        case 'roomSize':
            if (dragOn.roomSize) break;
            V.roomSize = clamp(v, P.roomSize.min, P.roomSize.max);
            paintKnob('roomSize');
            break;
        case 'cutoff':
            if (dragOn.cutoff) break;
            V.cutoff = clamp(v, P.cutoff.min, P.cutoff.max);
            paintKnob('cutoff');
            break;
        case 'masterGain':
            if (dragOn.masterGain) break;
            V.masterGain = clamp(v, P.masterGain.min, P.masterGain.max);
            paintKnob('masterGain');
            break;
        case 'outFL':
            lvlL = v;
            setMeter('mtrFL', 'capFL', v);
            updateGlow(Math.max(lvlL, lvlRL), Math.max(lvlR, lvlRR));
            break;
        case 'outFR':
            lvlR = v;
            setMeter('mtrFR', 'capFR', v);
            updateGlow(Math.max(lvlL, lvlRL), Math.max(lvlR, lvlRR));
            break;
        case 'outRL':
            lvlRL = v;
            setMeter('mtrRL', 'capRL', v);
            updateGlow(lvlL, lvlRL);
            break;
        case 'outRR':
            lvlRR = v;
            setMeter('mtrRR', 'capRR', v);
            updateGlow(lvlL, lvlRR);
            break;
    }
}

Cabbage.addMessageListener(msg => {
    const data = msg.data ?? msg;
    if (msg.command === 'widgetUpdate') {
        const id = data.id ?? data.channel;
        const v = data.value !== undefined ? data.value : Cabbage.extractValue(data, id);
        applyValue(id, v);
    } else if (msg.command === 'batchWidgetUpdate') {
        for (const w of msg.widgets ?? []) {
            const e = w.data ?? w;
            applyValue(e.id, Cabbage.extractValue(e, e.id));
        }
    } else if (msg.command === 'resizeResponse') {
        if (hostResize !== 'accepted') {
            const d = msg.data ?? msg;
            hostResize = d.accepted ? 'accepted' : 'rejected';
            if (hostResize === 'accepted') { reqViewport = 0; clearTimeout(reqTimer); }
            paintZoomBadge();
        }
    } else if (msg.command === 'parameterChange') {
        const pm = msg.data ?? msg;
        const id = typeof pm.channel === 'string' ? pm.channel : PARAM_IDX[pm.paramIdx];
        if (id) applyValue(id, pm.value);
    }
});

/* ---------------- 窗口缩放（§6.3 / §6.6 / §6.7） ---------------- */
const CANVAS = { w: 620, h: 700 };
const BASE = 1;
const MIN_SCALE = 0.75 * BASE;

const MAX_FILL = 0.94;
const screenW = () => (screen.availWidth || screen.width || 0);
const screenH = () => (screen.availHeight || screen.height || 0);

function maxScale() {
    const sw = screenW(), sh = screenH();
    const byW = sw ? sw / CANVAS.w : 3;
    const byH = sh ? sh / CANVAS.h : 3;
    return Math.max(MIN_SCALE, Math.min(12, Math.min(byW, byH) * MAX_FILL));
}

const viewScale = () => Math.min(innerWidth / CANVAS.w, innerHeight / CANVAS.h);

let hostResize = 'unknown';
let reqViewport = 0;
let reqTimer = 0;

let zoomDrag = null;
let holdScale = null;

const yOf = e => (typeof e.screenY === 'number' && e.screenY !== 0) ? e.screenY : e.clientY;
let pendingScale = null;
let rafId = 0;
let lastSent = 0;
let dragEndedAt = 0;

function paintZoomBadge(override) {
    const s = override != null ? override : viewScale() / BASE;
    document.body.style.setProperty('--zoom', (s * BASE).toFixed(4));
    $('zpct').textContent = Math.round(s * 100) + '%';
    $('zoomer').dataset.host = hostResize;
}

function fitToViewport() {
    if (reqViewport && (innerWidth !== reqViewport.w || innerHeight !== reqViewport.h)) {
        reqViewport = 0;
        clearTimeout(reqTimer);
        hostResize = 'accepted';
    }
    if (holdScale != null && Math.abs(viewScale() / BASE - holdScale) < 0.01) holdScale = null;
    paintZoomBadge(zoomDrag && zoomDrag.moved ? zoomDrag.target : (holdScale ?? undefined));
}

function requestWindowScale(scale) {
    let w = Math.round(CANVAS.w * scale * BASE);
    let h = Math.round(CANVAS.h * scale * BASE);
    const limit = Math.floor(screenH() * MAX_FILL);
    if (limit > 0 && h > limit) {
        h = limit;
        w = Math.round(h * CANVAS.w / CANVAS.h);
    }
    reqViewport = { w: innerWidth, h: innerHeight };
    clearTimeout(reqTimer);
    reqTimer = setTimeout(() => {
        if (reqViewport) { reqViewport = 0; hostResize = 'rejected'; holdScale = null; paintZoomBadge(); }
    }, 600);
    Cabbage.requestResize(w, h, null);
}

function scheduleResizeRequest() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
        rafId = 0;
        if (pendingScale == null) return;
        if (lastSent && Math.abs(pendingScale - lastSent) < 0.004) return;
        lastSent = pendingScale;
        requestWindowScale(lastSent);
    });
}

$('zoomer').addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    $('zoomer').setPointerCapture(e.pointerId);
    const s = viewScale() / BASE;
    zoomDrag = {
        anchorY: yOf(e), startScale: s, moved: false, target: s,
        ceiling: Math.max(s, maxScale())
    };
    dragOn.zoom = true;
    document.body.classList.add('dragging-zoom');
});

$('zoomer').addEventListener('pointermove', e => {
    if (!zoomDrag) return;
    const dy = yOf(e) - zoomDrag.anchorY;
    if (!zoomDrag.moved && Math.abs(dy) < 2) return;
    zoomDrag.moved = true;
    e.preventDefault();
    /* 往下 = 把窗口右下角拉出去 = 变大 */
    const raw = zoomDrag.startScale * Math.exp(dy / 220);
    const target = Math.min(zoomDrag.ceiling, Math.max(MIN_SCALE, raw));
    zoomDrag.target = target;
    pendingScale = target;
    paintZoomBadge(target);
    scheduleResizeRequest();
});

function endZoomDrag(e) {
    if (!zoomDrag) return;
    const moved = zoomDrag.moved;
    const finalScale = zoomDrag.target;
    zoomDrag = null;
    pendingScale = null;
    dragOn.zoom = false;
    document.body.classList.remove('dragging-zoom');
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    try { $('zoomer').releasePointerCapture(e.pointerId); } catch (_) {}
    if (moved) {
        dragEndedAt = performance.now();
        if (Math.abs(finalScale - lastSent) >= 0.004) {
            lastSent = finalScale;
            requestWindowScale(finalScale);
        }
        holdScale = finalScale;
        paintZoomBadge(finalScale);
        return;
    }
    paintZoomBadge();
}
$('zoomer').addEventListener('pointerup', endZoomDrag);
$('zoomer').addEventListener('pointercancel', endZoomDrag);

$('zoomer').addEventListener('dblclick', e => {
    e.preventDefault();
    if (performance.now() - dragEndedAt < 400) return;
    lastSent = BASE;
    holdScale = BASE;
    requestWindowScale(BASE);
    paintZoomBadge(BASE);
});

function initZoom() {
    paintZoomBadge();
    lastSent = viewScale() / BASE;
    new ResizeObserver(fitToViewport).observe(document.documentElement);
    addEventListener('resize', fitToViewport);
}

initZoom();

/* ---------------- 启动 ---------------- */

}

setMeter('mtrFR', 'capFR', 0);
setMeter('mtrRL', 'capRL', 0);
setMeter('mtrRR', 'capRR', 0);
updateGlow(0, 0);

/* 拖动期间禁止原生选中/拖影；输入框必须放行 */
for (const ev of ['selectstart', 'dragstart']) {
    document.addEventListener(ev, e => {
        if (e.target && e.target.closest && e.target.closest('input')) return;
        if (Object.values(dragOn).some(Boolean)) e.preventDefault();
    });
}

Cabbage.sendCustomCommand('cabbageIsReadyToLoad', null);

/* ===== 圆盘模型（Ambi 声场是圆盘，方形四角在盘外）=====
   画盘边 + 盘外斜纹，并把坐标钳制到盘内，与 DSP 的距离截断保持一致。 */
(function markDisc() {
    const svg = document.querySelector('#scene');
    if (!svg) return;
    const NS = 'http://www.w3.org/2000/svg';
    const CXv = 310, CYv = 223, R = 165;
    let defs = svg.querySelector('defs');
    if (!defs) {
        defs = document.createElementNS(NS, 'defs');
        svg.insertBefore(defs, svg.firstChild);
    }
    if (!svg.querySelector('#hatch')) {
        const pat = document.createElementNS(NS, 'pattern');
        pat.setAttribute('id', 'hatch');
        pat.setAttribute('width', '7');
        pat.setAttribute('height', '7');
        pat.setAttribute('patternUnits', 'userSpaceOnUse');
        pat.setAttribute('patternTransform', 'rotate(45)');
        const ln = document.createElementNS(NS, 'line');
        ln.setAttribute('x1', '0'); ln.setAttribute('y1', '0');
        ln.setAttribute('x2', '0'); ln.setAttribute('y2', '7');
        ln.setAttribute('stroke', 'rgba(255,255,255,.085)');
        ln.setAttribute('stroke-width', '1');
        pat.appendChild(ln);
        defs.appendChild(pat);
    }
    const g = document.createElementNS(NS, 'g');
    const dead = document.createElementNS(NS, 'path');
    dead.setAttribute('fill', 'url(#hatch)');
    dead.setAttribute('fill-rule', 'evenodd');
    dead.setAttribute('d',
        'M' + (CXv - R) + ' ' + (CYv - R) + 'H' + (CXv + R) +
        'V' + (CYv + R) + 'H' + (CXv - R) + 'Z ' +
        'M' + (CXv - R) + ' ' + CYv + 'A' + R + ' ' + R + ' 0 1 0 ' +
        (CXv + R) + ' ' + CYv + 'A' + R + ' ' + R + ' 0 1 0 ' +
        (CXv - R) + ' ' + CYv + 'Z');
    const disc = document.createElementNS(NS, 'circle');
    disc.setAttribute('cx', CXv);
    disc.setAttribute('cy', CYv);
    disc.setAttribute('r', R);
    disc.setAttribute('fill', 'none');
    disc.setAttribute('stroke', 'rgba(255,255,255,.30)');
    disc.setAttribute('stroke-width', '1');
    g.appendChild(dead);
    g.appendChild(disc);
    /* 插入到 pad 底板之后、参考圈之前，否则会被不透明的 .padfill 盖住 */
    const fill = svg.querySelector('.padfill');
    if (fill && fill.nextSibling) svg.insertBefore(g, fill.nextSibling);
    else if (fill) svg.appendChild(g);
    else svg.insertBefore(g, defs.nextSibling);
})();
/* ---------------- 内置使用手册 ----------------
   顶栏 ? 在 iframe 里打开 help.html。只用内嵌：WebView 里 window.open 是死按钮。 */
import('./help-ui.js').then(({ attachHelp }) => attachHelp())
    .catch(e => console.warn('Cabbage: 手册模块不可用 —', e));
</script>
