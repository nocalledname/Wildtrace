<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cab3-Quad-Levy</title>
<style>
    :root {
        --bg: #050505;
        --bg2: #0a0405;
        --red: #ff113e;
        --red-soft: rgba(255, 17, 62, .30);
        --red-dim: rgba(255, 17, 62, .55);
        --red-lab: rgba(255, 17, 62, .95);      /* 分组标题：需在小字号下可读 */
        --green: #00c85a;
        --green-dim: rgba(0, 200, 90, .26);
        --green-faint: rgba(0, 200, 90, .10);
        --fg: #f2e9ea;
        --dim: rgba(242, 233, 234, .46);
        --faint: rgba(242, 233, 234, .18);
        --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        --lvl: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
    }

    body {
        --zoom: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .canvas {
        width: 380px;
        height: 560px;
        flex: none;
        padding: 13px 16px 10px;
        transform: scale(var(--zoom));
        transform-origin: center center;
        display: flex;
        flex-direction: column;
        color: var(--fg);
        font-family: -apple-system, "Helvetica Neue", "PingFang SC", Arial, sans-serif;
        font-size: 10px;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overflow: hidden;
        position: relative;
        background:
            radial-gradient(ellipse 90% 60% at 50% 26%, #140507 0%, #0a0405 46%, var(--bg) 100%);
    }

    /* 顶部红光：捕猎者的视野边缘 */
    .canvas::before {
        content: "";
        position: absolute;
        left: 0; right: 0; top: 0;
        height: 42%;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(ellipse 70% 100% at 50% 0%,
            rgba(255, 17, 62, .10) 0%, transparent 72%);
        opacity: calc(.55 + var(--lvl) * .45);
        will-change: opacity;
    }
    /* 底部压暗 */
    .canvas::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: linear-gradient(to bottom, transparent 48%, rgba(2, 0, 1, .78) 100%);
    }
    .canvas > * { position: relative; z-index: 1; }

    body.dragging,
    body.dragging * {
        user-select: none !important;
        -webkit-user-select: none !important;
    }
    body.dragging input { pointer-events: none !important; cursor: default !important; }
    body.dragging ::selection { background: transparent; }

    /* ---------------- 顶栏 ---------------- */
    header {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 7px;
        border-bottom: 1px solid rgba(255, 17, 62, .18);
    }
    .mark { display: flex; align-items: center; gap: 7px; }
    .mark svg { display: block; width: 13px; height: 13px; }
    .brand {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .40em;
        color: var(--fg);
    }
    .tag {
        font-family: var(--mono);
        font-size: 6.5px;
        letter-spacing: .30em;
        text-transform: uppercase;
        color: var(--red-dim);
    }

    /* ---------------- 雷达区 ---------------- */
    .stage {
        flex: none;
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    /* ===== 电平表：表柱 + dB 标尺（与 Stasis 同一套，见模板 §6.15） =====
       电平按 dB 映射：0 dB 在顶、-60 dB 在底。标尺刻度由 JS 按 dB 位置生成。
       L 表：柱在内、刻度在外；R 表镜像。 */
    .metercol { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .metercol > span {
        height: 8px;
        font-family: var(--mono);
        font-size: 6px;
        line-height: 8px;
        letter-spacing: .18em;
        color: var(--red-dim);
    }

    .meterbody { display: flex; align-items: stretch; gap: 3px; }
    .meterbody.mirror { flex-direction: row-reverse; }

    .bar { position: relative; width: 10px; height: 150px; flex: none; }
    .bar::before, .bar::after {
        content: "";
        position: absolute;
        top: 0; bottom: 0;
        width: 1px;
        background: rgba(255, 17, 62, .26);
    }
    .bar::before { left: 0; }
    .bar::after { right: 0; }
    .bar i {
        position: absolute;
        left: 1px; right: 1px; bottom: 0;
        height: 100%;
        transform-origin: bottom center;
        transform: scaleY(0);
        background: linear-gradient(to top,
            var(--red) 0%,
            rgba(255, 40, 60, .72) 46%,
            rgba(255, 130, 70, .60) 100%);
        transition: transform .05s linear;
        will-change: transform;
    }
    /* 峰值亮帽 */
    .bar b {
        position: absolute;
        left: 0; right: 0;
        height: 1px;
        bottom: 0;
        background: #ffb08a;
        transform: translateY(0);
        transition: transform .05s linear, opacity .12s linear;
        opacity: 0;
        will-change: transform;
    }

    /* dB 标尺 */
    .dbscale { position: relative; width: 26px; height: 150px; flex: none; }
    .dbscale .t { position: absolute; left: 0; right: 0; height: 0; }
    .dbscale .t::before {
        content: "";
        position: absolute;
        left: 0; top: 0;
        width: 3px; height: 1px;
        background: rgba(255, 17, 62, .38);
    }
    .dbscale .t.major::before { width: 5px; background: rgba(255, 60, 80, .62); }
    .dbscale .t .n {
        position: absolute;
        right: 0; top: -3.6px;
        font-family: var(--mono);
        font-size: 6.5px; line-height: 1;
        letter-spacing: .01em;
        color: rgba(255, 70, 90, .46);
    }
    .dbscale .t.major .n { color: rgba(255, 110, 120, .70); }
    .dbscale .t.zero .n { color: rgba(255, 200, 190, .88); }

    /* 右表镜像：刻度贴外侧，数字靠内 */
    .meterbody.mirror .dbscale .t::before { left: auto; right: 0; }
    .meterbody.mirror .dbscale .t .n { right: auto; left: 0; }

    .radar {
        width: 174px;
        height: 174px;
        position: relative;
        flex: none;
    }
    .radar > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .radar .grid { fill: none; stroke: var(--green); stroke-width: 1; opacity: .16; }
    .radar .grid.major { opacity: .30; }
    .radar .axis { stroke: var(--green); stroke-width: 1; opacity: .13; stroke-dasharray: 1 5; }
    .radar .frame { fill: none; stroke: var(--red); stroke-width: 1; opacity: .26; }
    .radar .bracket { fill: none; stroke: var(--red); stroke-width: 1.4; opacity: .78; }

    /* 雷达扫描线：野性呼吸感 */
    .radar .sweep {
        transform-origin: 95px 95px;
        animation: sweep 6.4s linear infinite;
    }
    .radar .sweep line { stroke: var(--red); stroke-width: 1.2; opacity: .34; }
    .radar .sweep .glow {
        stroke: none;
        fill: url(#sweepGrad);
        opacity: .5;
    }
    @keyframes sweep {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }

    /* 飞行轨迹：每段独立淡出 */
    .radar .trail { fill: none; stroke: var(--red); stroke-width: 1; stroke-linecap: round; }
    .radar .pathseg { stroke-linecap: round; }

    .ballwrap {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        will-change: transform;
    }
    .ballwrap::before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 17, 62, .42) 0%, transparent 68%);
    }
    .ball {
        position: relative;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 6px rgba(255, 17, 62, .85), 0 0 14px rgba(255, 17, 62, .38);
    }

    /* ---------------- 分组标签 ---------------- */
    .glab {
        flex: none;
        margin-top: 4px;      /* 字号加大后收紧，保证 560 高度内不溢出 */
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 8.5px;
        line-height: 10px;
        letter-spacing: .26em;
        text-transform: uppercase;
        color: var(--red-lab);
    }
    .glab::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(to right, rgba(255, 17, 62, .28), transparent);
    }

    /* ---------------- 旋钮 ---------------- */
    .knobs {
        flex: none;
        display: flex;
        justify-content: center;
    }
    .knobs.r1 { margin-top: 5px; gap: 16px; }
    .knobs.r2 { margin-top: 3px; gap: 16px; }
    .knobs.r3 { margin-top: 2px; gap: 34px; align-items: center; }

    .knob {
        width: 66px;
        text-align: center;
        cursor: ns-resize;
        touch-action: none;
        position: relative;
    }
    .knob svg { display: block; width: 56px; height: 56px; margin: 0 auto; overflow: visible; }
    .knob .plate { fill: rgba(0, 40, 20, .55); stroke: rgba(255, 17, 62, .18); stroke-width: 1; }
    .knob .gauge { fill: none; stroke: rgba(255, 17, 62, .13); stroke-width: 1.6; }
    .knob .arc {
        fill: none;
        stroke: var(--red);
        stroke-width: 1.7;
        stroke-linecap: round;
        filter: drop-shadow(0 0 3px rgba(255, 17, 62, .55));
        transition: stroke-dasharray .05s linear;
    }
    .knob .tick { stroke: rgba(0, 200, 90, .22); stroke-width: 1; }
    .knob .tick.major { stroke: rgba(0, 200, 90, .48); }

    /* 数值输入框：平时不接管指针（整块旋钮都能拖），单击旋钮才进入编辑 */
    .kval {
        position: absolute;
        left: 50%;
        top: 28px;
        transform: translate(-50%, -50%);
        width: 54px;
        height: 16px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--fg);
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 300;
        letter-spacing: .01em;
        text-align: center;
        outline: none;
        pointer-events: none;
        -webkit-user-select: text;
        user-select: text;
        -webkit-appearance: none;
        appearance: none;
    }
    .knob.editing { cursor: text; }
    .knob.editing .kval {
        pointer-events: auto;
        background: rgba(255, 17, 62, .14);
        box-shadow: 0 0 0 1px rgba(255, 17, 62, .62);
    }

    .klab {
        margin-top: 3px;
        font-family: var(--mono);
        font-size: 8px;
        line-height: 10px;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #fff;
        white-space: nowrap;
    }

    /* ---------------- 混响发送 ---------------- */
    .wet { flex: none; width: 240px; margin: 7px auto 0; }
    .wet .ls {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: #fff;
        margin-bottom: 6px;
        text-align: center;
    }
    .dual { position: relative; width: 100%; height: 16px; }
    .dual .ticks {
        position: absolute;
        left: 0; right: 0; top: 50%;
        height: 5px;
        margin-top: -2.5px;
        background: repeating-linear-gradient(90deg,
            rgba(0, 200, 90, .18) 0 1px, transparent 1px 10%);
        pointer-events: none;
    }
    .dual .track {
        position: absolute;
        left: 0; right: 0; top: 50%;
        height: 1px; margin-top: -0.5px;
        background: rgba(255, 17, 62, .22);
    }
    .dual .range {
        position: absolute;
        top: 50%;
        height: 1px;
        margin-top: -0.5px;
        background: var(--red);
        box-shadow: 0 0 7px rgba(255, 17, 62, .55);
    }
    .dual .thumb {
        position: absolute;
        top: 50%;
        width: 8px; height: 8px;
        margin-top: -4px;
        margin-left: -4px;
        border-radius: 50%;
        background: #0d0204;
        border: 1px solid var(--red-dim);
        cursor: ew-resize;
        touch-action: none;
        transition: border-color .14s ease, box-shadow .14s ease, transform .1s ease;
    }
    .dual .thumb:hover {
        border-color: var(--red);
        box-shadow: 0 0 0 3px rgba(255, 17, 62, .12), 0 0 9px rgba(255, 17, 62, .45);
    }
    .dual .thumb:active { transform: scale(1.14); }
    .wet .vals {
        display: flex;
        justify-content: space-between;
        margin-top: 5px;
        font-family: var(--mono);
        font-size: 8px;
        font-weight: 300;
        letter-spacing: .06em;
        color: var(--fg);
    }
    .wet .vals input {
        width: 46px;
        padding: 1px 3px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        letter-spacing: inherit;
        text-align: left;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
        -webkit-appearance: none;
        appearance: none;
    }
    .wet .vals input:last-child { text-align: right; }
    .wet .vals input:focus {
        background: rgba(255, 17, 62, .14);
        box-shadow: 0 0 0 1px rgba(255, 17, 62, .62);
    }

    /* ---------------- 缩放三角 ---------------- */
    .zoomer {
        position: absolute;
        right: 0; bottom: 0;
        width: 30px; height: 30px;
        padding: 0;
        border: 0;
        background: none;
        cursor: ns-resize;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        z-index: 20;
    }
    .zoomer svg { display: block; width: 13px; height: 13px; margin: 0 4px 4px 0; }
    .zoomer path { fill: rgba(255, 17, 62, .42); transition: fill .14s ease; }
    .zoomer:hover path { fill: rgba(255, 17, 62, .95); }
    .zoomer:active path { fill: var(--red); }
    .zoomer[data-host="accepted"] path { fill: rgba(255, 17, 62, .68); }
    .zoomer[data-host="rejected"] path {
        fill: none;
        stroke: rgba(255, 17, 62, .50);
        stroke-width: 1.1;
    }
    .zoomer[data-host="rejected"]:hover path { stroke: var(--red); fill: none; }
    .zoomer .zpct {
        position: absolute;
        right: 20px; bottom: 3px;
        font-family: var(--mono);
        font-size: 6px;
        letter-spacing: .10em;
        color: var(--red-dim);
        opacity: 0;
        transition: opacity .14s ease;
        pointer-events: none;
        white-space: nowrap;
    }
    .zoomer:hover .zpct { opacity: 1; }
    body.dragging-zoom .zoomer .zpct { opacity: 1; }

    /* ---------------- 底栏 ---------------- */
    footer {
        flex: none;
        margin-top: auto;
        padding-top: 3px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--mono);
        text-transform: uppercase;
    }
    footer span {
        font-size: 7px;
        letter-spacing: .28em;
        color: rgba(242, 233, 234, .22);
    }
    footer .eng { color: rgba(255, 17, 62, .42); }
    /* ===== 四声道电平表：左 FL/RL、右 FR/RR（左柱内、刻度外；右表镜像） ===== */
    .mside { display: flex; flex-direction: column; justify-content: space-between; height: 176px; flex: none; }
    .mside .metercol { position: static; }
    .bar { height: 70px; }
    .dbscale { height: 70px; }
</style>
</head>
<body>

<div class="canvas" id="canvas">

<header>
    <div class="mark">
        <svg class="mark" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="width:13px;height:13px;flex:none;display:block">
  <path d="M2.8 12.9 4.3 11.6 3.9 10.2 6.9 9.6 6.2 7.4 13.3 2.9" stroke="#ff113e" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="13.3" cy="2.9" r="1.7" fill="#ff113e"/>
</svg>
        <span class="brand">LÉVY</span>
    </div>
    <span class="tag">Quad Doppler</span>
</header>

<section class="stage">
    <div class="mside left">
        <div class="metercol">
            <span>FL</span>
            <div class="meterbody">
                <div class="bar"><i id="mtrFL"></i><b id="capFL"></b></div>
                <div class="dbscale" id="scaleFL"></div>
            </div>
        </div>
        <div class="metercol">
            <span>RL</span>
            <div class="meterbody">
                <div class="bar"><i id="mtrRL"></i><b id="capRL"></b></div>
                <div class="dbscale" id="scaleRL"></div>
            </div>
        </div>
    </div>

    <div class="radar" id="radar">
        <svg viewBox="0 0 190 190" aria-hidden="true">
            <defs>
                <radialGradient id="sweepGrad" cx="0%" cy="50%" r="100%">
                    <stop offset="0%" stop-color="rgba(255,17,62,0.30)"/>
                    <stop offset="100%" stop-color="rgba(255,17,62,0)"/>
                </radialGradient>
                <clipPath id="padClip">
                    <rect x="0" y="0" width="190" height="190"/>
                </clipPath>
            </defs>

            <!-- 同心雷达圈 -->
            <g clip-path="url(#padClip)">
                <circle class="grid" cx="95" cy="95" r="23.75"/>
                <circle class="grid" cx="95" cy="95" r="47.5"/>
                <circle class="grid major" cx="95" cy="95" r="71.25"/>
                <circle class="grid" cx="95" cy="95" r="95"/>
                <line class="axis" x1="95" y1="0" x2="95" y2="190"/>
                <line class="axis" x1="0" y1="95" x2="190" y2="95"/>
            </g>

            <!-- 飞行轨迹（JS 注入 polyline） -->
            <g class="trail" id="trail"></g>

            <!-- 扫描线 -->
            <g class="sweep" clip-path="url(#padClip)">
                <line x1="95" y1="95" x2="95" y2="6"/>
            </g>

            <rect class="frame" x="0.5" y="0.5" width="189" height="189"/>
            <!-- 四角括号：捕猎者的取景框 -->
            <path class="bracket" d="M 0.5 15 L 0.5 0.5 L 15 0.5"/>
            <path class="bracket" d="M 175 0.5 L 189.5 0.5 L 189.5 15"/>
            <path class="bracket" d="M 189.5 175 L 189.5 189.5 L 175 189.5"/>
            <path class="bracket" d="M 15 189.5 L 0.5 189.5 L 0.5 175"/>
        </svg>

        <div class="ballwrap" id="ballWrap">
            <div class="ball"></div>
        </div>
    </div>

    <div class="mside right">
        <div class="metercol">
            <span>FR</span>
            <div class="meterbody mirror">
                <div class="bar"><i id="mtrFR"></i><b id="capFR"></b></div>
                <div class="dbscale" id="scaleFR"></div>
            </div>
        </div>
        <div class="metercol">
            <span>RR</span>
            <div class="meterbody mirror">
                <div class="bar"><i id="mtrRR"></i><b id="capRR"></b></div>
                <div class="dbscale" id="scaleRR"></div>
            </div>
        </div>
    </div>
</section>

<div class="glab">Lévy Steps</div>
<section class="knobs r1">
    <div class="knob" id="kRate">
        <svg viewBox="0 0 56 56">
            <circle class="plate" cx="28" cy="28" r="20"></circle>
            <g id="tRate"></g>
            <circle class="gauge" id="gRate" cx="28" cy="28" r="23" transform="rotate(135 28 28)"></circle>
            <circle class="arc" id="aRate" cx="28" cy="28" r="23" transform="rotate(135 28 28)"></circle>
        </svg>
        <input class="kval" id="vRate" type="text" inputmode="decimal" value="4.00" spellcheck="false" autocomplete="off">
        <div class="klab">Rate</div>
    </div>

    <div class="knob" id="kAlpha">
        <svg viewBox="0 0 56 56">
            <circle class="plate" cx="28" cy="28" r="20"></circle>
            <g id="tAlpha"></g>
            <circle class="gauge" id="gAlpha" cx="28" cy="28" r="23" transform="rotate(135 28 28)"></circle>
            <circle class="arc" id="aAlpha" cx="28" cy="28" r="23" transform="rotate(135 28 28)"></circle>
        </svg>
        <input class="kval" id="vAlpha" type="text" inputmode="decimal" value="1.10" spellcheck="false" autocomplete="off">
        <div class="klab">Alpha</div>
    </div>

    <div class="knob" id="kScale">
        <svg viewBox="0 0 56 56">
            <circle class="plate" cx="28" cy="28" r="20"></circle>
            <g id="tScale"></g>
            <circle class="gauge" id="gScale" cx="28" cy="28" r="23" transform="rotate(135 28 28)"></circle>
            <circle class="arc" id="aScale" cx="28" cy="28" r="23" transform="rotate(135 28 28)"></circle>
        </svg>
        <input class="kval" id="vScale" type="text" inputmode="decimal" value="0.400" spellcheck="false" autocomplete="off">
        <div class="klab">Scale</div>
    </div>
</section>

<div class="glab">Suppression</div>
<section class="knobs r2">
    <div class="knob" id="kDamp">
        <svg viewBox="0 0 56 56">
            <circle class="plate" cx="28" cy="28" r="20"></circle>
            <g id="tDamp"></g>
            <circle class="gauge" id="gDamp" cx="28" cy="28" r="23" transform="rotate(135 28 28)"></circle>
            <circle class="arc" id="aDamp" cx="28" cy="28" r="23" transform="rotate(135 28 28)"></circle>
        </svg>
        <input class="kval" id="vDamp" type="text" inputmode="decimal" value="0.40" spellcheck="false" autocomplete="off">
        <div class="klab">Damp</div>
    </div>

    <div class="knob" id="kChaos">
        <svg viewBox="0 0 56 56">
            <circle class="plate" cx="28" cy="28" r="20"></circle>
            <g id="tChaos"></g>
            <circle class="gauge" id="gChaos" cx="28" cy="28" r="23" transform="rotate(135 28 28)"></circle>

<script type="module">
import { Cabbage } from './cabbage/cabbage.js';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = id => document.getElementById(id);

/* ---------------- 参数表 ----------------
   范围 / 默认值必须与 CSD 的 <Cabbage> 完全一致。
   def 必须等于 CSD 里该通道的 defaultValue —— 双击归位回到的就是它。 */
/* curve 是纯前端手感，不写进 CSD（宿主只认值）。
   rate 0.5~20（40×）→ k=4；scale 0.05~1（20×）→ k=3；inertia 0.001~0.4（400×）→ k=5；
   chaos 0~0.08 低端是"轻微随机"，要留手调空间 → k=2；alpha 0.3~2（6.7×）→ k=1.5；
   roomSize → k=1；cutoff → k=3；damp 是 0~1 比例量 → 线性。 */
const P = {
    rate:     { min: 0.5,  max: 20,    curve: 4,   step: 0.01,  def: 4,    fmt: v => v.toFixed(2) },
    alpha:    { min: 0.3,  max: 2,     curve: 1.5, step: 0.01,  def: 1.1,  fmt: v => v.toFixed(2) },
    scale:    { min: 0.05, max: 1,     curve: 3,   step: 0.001, def: 0.4,  fmt: v => v.toFixed(3) },
    damp:     { min: 0,    max: 1,     curve: 0,   step: 0.01,  def: 0.4,  fmt: v => v.toFixed(2) },
    chaos:    { min: 0,    max: 0.08,  curve: 2,   step: 0.001, def: 0.05, fmt: v => v.toFixed(3) },
    inertia:  { min: 0.001,max: 0.4,   curve: 5,   step: 0.001, def: 0.01, fmt: v => v.toFixed(3) },
    roomSize: { min: 10,   max: 100,   curve: 1,   step: 0.1,   def: 50,   fmt: v => String(Math.round(v)) },
    masterGain: { min: 0, max: 8, curve: 0, step: 0.01, def: 2, fmt: v => v.toFixed(2) },
    cutoff:   { min: 1000, max: 16000, curve: 3,   step: 1,     def: 16000,
                fmt: v => String(Math.round(v)) }
};

/* 湿声上下限不属于旋钮表，单独给默认值 */
const WET_DEF = { minWet: 0.1, maxWet: 0.3 };

/* 必须与 CSD 中 widget 的书写顺序一致（只含 automatable:true 的通道） */
const PARAM_IDX = ['rate', 'alpha', 'scale', 'damp', 'chaos', 'inertia',
                   'minWet', 'maxWet', 'roomSize', 'cutoff', 'masterGain'];

let rate = 4, alpha = 1.1, scaleV = 0.4;
let damp = 0.4, chaos = 0.05, inertia = 0.01;
let room = 50, cut = 16000, gain = 2;
let minWet = 0.1, maxWet = 0.3;

let levyX = 0.5, levyY = 0.5;
let lvlFL = 0, lvlFR = 0, lvlRL = 0, lvlRR = 0;

const dragOn = { rate: false, alpha: false, scale: false, damp: false, chaos: false,
                 inertia: false, roomSize: false, cutoff: false, masterGain: false, wet: null, zoom: false };

/* 拖拽独占：屏蔽输入框的原生选择/拖影 */
function beginDrag() {
    document.body.classList.add('dragging');
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
}
function endDrag() { document.body.classList.remove('dragging'); }

const anyDrag = () => document.body.classList.contains('dragging') ||
                       document.body.classList.contains('dragging-zoom') ||
                       Object.values(dragOn).some(Boolean);
for (const ev of ['selectstart', 'dragstart']) {
    document.addEventListener(ev, e => {
        /* 输入框里必须允许选中文本，否则没法改数值 */
        if (e.target && e.target.closest && e.target.closest('input')) return;
        if (anyDrag()) e.preventDefault();
    });
}

window.addEventListener('blur', () => {
    for (const k of Object.keys(dragOn)) {
        if (k === 'wet') dragOn.wet = null; else dragOn[k] = false;
    }
    document.body.classList.remove('dragging');
    document.body.classList.remove('dragging-zoom');
});

/* ---------------- 数值解析 ---------------- */
function parseNum(raw, p) {
    let t = String(raw).trim().toLowerCase().replace(/\s+/g, '');
    if (!t) return NaN;
    let mul = 1;
    if (t.endsWith('k')) { mul = 1000; t = t.slice(0, -1); }
    else if (t.endsWith('hz')) { t = t.slice(0, -2); }
    const n = parseFloat(t);
    if (!isFinite(n)) return NaN;
    const v = n * mul;
    return clamp(Math.round(v / p.step) * p.step, p.min, p.max);
}

const knobVal = key => ({
    rate: rate, alpha: alpha, scale: scaleV, damp: damp,
    chaos: chaos, inertia: inertia, roomSize: room, cutoff: cut, masterGain: gain
})[key];
const setKnobVal = (key, v) => {
    switch (key) {
        case 'rate': rate = v; break;
        case 'alpha': alpha = v; break;
        case 'scale': scaleV = v; break;
        case 'damp': damp = v; break;
        case 'chaos': chaos = v; break;
        case 'inertia': inertia = v; break;
        case 'roomSize': room = v; break;
        case 'cutoff': cut = v; break;
        case 'masterGain': gain = v; break;
    }
};

/* ---------------- 旋钮 ---------------- */
const KNOB_IDS = {
    rate:     { arc: 'aRate',    txt: 'vRate' },
    alpha:    { arc: 'aAlpha',   txt: 'vAlpha' },
    scale:    { arc: 'aScale',   txt: 'vScale' },
    damp:     { arc: 'aDamp',    txt: 'vDamp' },
    chaos:    { arc: 'aChaos',   txt: 'vChaos' },
    inertia:  { arc: 'aInertia', txt: 'vInertia' },
    roomSize: { arc: 'aRoom',    txt: 'vRoom' },
    cutoff:   { arc: 'aCut',     txt: 'vCut' },
    masterGain: { arc: 'aGain',  txt: 'vGain' }
};
const KNOB_EL = {
    rate: 'kRate', alpha: 'kAlpha', scale: 'kScale', damp: 'kDamp',
    chaos: 'kChaos', inertia: 'kInertia', roomSize: 'kRoom', cutoff: 'kCut',
    masterGain: 'kGain'
};

const KB = { r: 23, span: 0.75 };
const CIRC = 2 * Math.PI * KB.r;
const SPAN = CIRC * KB.span;

/* ---------------- 旋钮映射曲线（与 Singularity 同一套，见模板 §6.16）
   归一化值 n ∈ [0,1] ↔ 旋钮行程 f ∈ [0,1]，一个数 curve 定整条曲线：
     curve = 0    线性
     curve = k>0  指数：低端展开（时间 / 频率这类跨数量级参数必须给）
     curve = k<0  反向：高端展开
   n = (e^(k·f) − 1) / (e^k − 1)      f = ln(1 + n·(e^k − 1)) / k
   两式严格互逆，拖动 → 写值 → 回灌 → 重画不会漂。 */
const CURVE_MAX_K = 12;                 // e^12 ≈ 1.6e5，防溢出
const curveToNorm = (f, k) => {
    if (!k) return f;
    const K = Math.min(Math.abs(k), CURVE_MAX_K), A = Math.exp(K) - 1;
    return k > 0 ? (Math.exp(K * f) - 1) / A
                 : 1 - (Math.exp(K * (1 - f)) - 1) / A;
};
const normToCurve = (n, k) => {
    if (!k) return n;
    const K = Math.min(Math.abs(k), CURVE_MAX_K), A = Math.exp(K) - 1;
    return k > 0 ? Math.log(1 + n * A) / K
                 : 1 - Math.log(1 + (1 - n) * A) / K;
};

const toFrac   = (v, p) => normToCurve(clamp((v - p.min) / (p.max - p.min), 0, 1), p.curve || 0);
const fromFrac = (f, p) => p.min + (p.max - p.min) * curveToNorm(clamp(f, 0, 1), p.curve || 0);

function buildTicks(groupId) {
    const g = $(groupId);
    const NS = 'http://www.w3.org/2000/svg';
    for (let i = 0; i <= 20; i++) {
        const f = i / 20;
        const deg = 225 + f * 270;
        const rad = deg * Math.PI / 180;
        const major = i % 5 === 0;
        const r1 = major ? 25.4 : 26.0;
        const r2 = 27.6;
        const line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', (28 + r1 * Math.sin(rad)).toFixed(2));
        line.setAttribute('y1', (28 - r1 * Math.cos(rad)).toFixed(2));
        line.setAttribute('x2', (28 + r2 * Math.sin(rad)).toFixed(2));
        line.setAttribute('y2', (28 - r2 * Math.cos(rad)).toFixed(2));
        line.setAttribute('class', major ? 'tick major' : 'tick');
        g.appendChild(line);
    }
}

/* 编辑态：正在敲的输入框不要被后端推送覆盖 */
const editing = { key: null, el: null, knob: null };
const DBL_MS = 350;
let lastTapAt = 0, lastTapKey = null;

function paintKnob(key) {
    const p = P[key];
    const v = knobVal(key);
    const f = toFrac(clamp(v, p.min, p.max), p);
    const ids = KNOB_IDS[key];
    $(ids.arc).setAttribute('stroke-dasharray', (f * SPAN).toFixed(2) + ' ' + CIRC.toFixed(2));
    if (editing.key === key) return;
    $(ids.txt).value = p.fmt(v);
}

function openEditor(key, el) {
    if (editing.el === el) { el.select(); return; }
    closeEditor(true);
    editing.key = key;
    editing.el = el;
    editing.knob = el.closest('.knob');
    if (editing.knob) editing.knob.classList.add('editing');
    el.value = P[key].fmt(knobVal(key));
    el.focus();
    el.select();
}

function closeEditor(silent) {
    const el = editing.el;
    if (!el) return;
    const wasKey = editing.key;
    editing.key = null;
    editing.el = null;
    if (editing.knob) editing.knob.classList.remove('editing');
    editing.knob = null;
    if (!silent) { el.blur(); if (wasKey) paintKnob(wasKey); }
}

function commitEdit() {
    const key = editing.key;
    if (!key) return;
    const v = parseNum(editing.el.value, P[key]);
    closeEditor();
    if (!isFinite(v)) { paintKnob(key); return; }
    setKnobVal(key, v);
    paintKnob(key);
    Cabbage.sendControlData({ channel: key, value: v, gesture: 'complete' }, null);
}

function resetKnob(key) {
    const d = P[key].def;
    setKnobVal(key, d);
    paintKnob(key);
    Cabbage.sendControlData({ channel: key, value: d, gesture: 'complete' }, null);
}

function bindKnob(elId, key) {
    const el = $(elId);
    const p = P[key];
    const txt = $(KNOB_IDS[key].txt);
    /* 统一 tap 逻辑：不在 pointerdown 里按 target 分叉，
       否则第二次点击会绕过双击判定，导致归位失效。 */
    let startY = 0, startX = 0, startF = 0, accF = 0, lastY = 0, dragging = false, active = false, onInput = false, moved = false;

    el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        active = true;
        dragging = false;
        onInput = (e.target === txt);
        startX = e.clientX;
        moved = false;
        startY = e.clientY;
        startF = toFrac(clamp(knobVal(key), p.min, p.max), p);
        accF = startF;
        lastY = e.clientY;
        if (!onInput) {
            el.setPointerCapture(e.pointerId);
            e.preventDefault();
        }
    });

    el.addEventListener('pointermove', e => {
        if (!active) return;
        /* 编辑态：只记录有没有发生选词拖动，绝不旋钮拖动 */
        if (onInput) {
            if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) moved = true;
            return;
        }
        const dy = startY - e.clientY;
        if (!dragging) {
            if (Math.abs(dy) < 3) return;                 // 死区：留给单击编辑
            dragging = true;
            dragOn[key] = true;
            beginDrag();
            closeEditor(true);
            Cabbage.sendControlData({ channel: key, value: knobVal(key), gesture: 'begin' }, null);
        }
        e.preventDefault();
        /* Shift 精调：同样位移只走 1/5 行程。
           ★ 必须按「每帧增量」累加，不能用 (起点 → 当前) 的总位移：
             否则拖动中途按下/松开 Shift，分母突变，数值会瞬间跳一大截。 */
        accF = clamp(accF + (lastY - e.clientY) / (e.shiftKey ? 750 : 150), 0, 1);
        lastY = e.clientY;
        let v = fromFrac(accF, p);
        v = clamp(Math.round(v / p.step) * p.step, p.min, p.max);
        setKnobVal(key, v);
        paintKnob(key);
        Cabbage.sendControlData({ channel: key, value: v, gesture: 'value' }, null);
    });

    const up = e => {
        if (!active) return;
        active = false;
        const wasInput = onInput;
        const wasMoved = moved;
        onInput = false;
        moved = false;
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}

        if (dragging) {
            dragging = false;
            dragOn[key] = false;
            endDrag();
            Cabbage.sendControlData({ channel: key, value: knobVal(key), gesture: 'end' }, null);
            return;
        }

        /* 在文本框里拖动 = 选词，不算点击，更不能触发归位 */
        if (wasMoved) { lastTapAt = 0; lastTapKey = null; return; }

        /* 未拖动 = 单击。两次 tap 间隔 < DBL_MS → 归位 */
        const now = performance.now();
        if (lastTapKey === key && now - lastTapAt < DBL_MS) {
            lastTapAt = 0; lastTapKey = null;
            closeEditor();
            resetKnob(key);
            return;
        }
        lastTapAt = now; lastTapKey = key;
        if (!wasInput) openEditor(key, txt);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('contextmenu', e => e.preventDefault());

    txt.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); commitEdit(); }
        else if (e.key === 'Escape') {
            e.preventDefault();
            const k = editing.key;
            closeEditor();
            if (k) paintKnob(k);
        }
    });
    txt.addEventListener('blur', () => { if (editing.key === key) commitEdit(); });
    /* 不 stopPropagation：编辑态下第二击的 target 是 input，
       若挡住冒泡，knob 收不到 pointerdown，双击归位永远不触发。
       拖动由 pointermove 里的 onInput 守卫拦住。 */
    txt.addEventListener('dblclick', e => {
        e.preventDefault(); e.stopPropagation();
        closeEditor();
        resetKnob(key);
    });
}

/* ---------------- 雷达与轨迹 ---------------- */
const RADAR = 190;
const trailEl = $('trail');
const TRAIL_MAX = 26;                 // 轨迹点数（莱维飞行是跳跃的，短轨迹更像捕猎）
const trailPts = [];                  // {x, y} 归一化

function placeBall() {
    const b = $('ballWrap');
    b.style.left = (clamp(levyX, 0, 1) * 100).toFixed(3) + '%';
    b.style.top = ((1 - clamp(levyY, 0, 1)) * 100).toFixed(3) + '%';
}

const NS = 'http://www.w3.org/2000/svg';

function paintTrail() {
    /* 清空后重画：点数很少（≤26），比重用节点更简单可靠 */
    while (trailEl.firstChild) trailEl.removeChild(trailEl.firstChild);
    for (let i = 1; i < trailPts.length; i++) {
        const a = trailPts[i - 1], b = trailPts[i];
        /* 跳跃距离过大的段（莱维长尾）单独画，保持断裂感 */
        const seg = document.createElementNS(NS, 'line');
        seg.setAttribute('x1', (a.x * RADAR).toFixed(2));
        seg.setAttribute('y1', ((1 - a.y) * RADAR).toFixed(2));
        seg.setAttribute('x2', (b.x * RADAR).toFixed(2));
        seg.setAttribute('y2', ((1 - b.y) * RADAR).toFixed(2));
        /* 越新越亮：旧段保留一点底噪，才看得出「跳跃」的路径 */
        const t = i / trailPts.length;
        seg.setAttribute('stroke-width', (0.6 + t * 1.1).toFixed(2));
        seg.setAttribute('opacity', (0.10 + t * t * 0.85).toFixed(3));
        trailEl.appendChild(seg);
    }
}

function pushTrail(x, y) {
    const last = trailPts[trailPts.length - 1];
    if (last && Math.abs(last.x - x) < 1e-4 && Math.abs(last.y - y) < 1e-4) return;
    trailPts.push({ x, y });
    while (trailPts.length > TRAIL_MAX) trailPts.shift();
    paintTrail();
}

/* ---------------- 混响发送 ---------------- */
const wetEditing = { key: null };

function paintWet() {
    const w = $('dual').clientWidth;
    const l = minWet * w, r = maxWet * w;
    $('wetRange').style.left = l + 'px';
    $('wetRange').style.width = Math.max(0, r - l) + 'px';
    $('thumbMin').style.left = l + 'px';
    $('thumbMax').style.left = r + 'px';
    if (wetEditing.key !== 'minWet') $('wetMinOut').value = minWet.toFixed(2);
    if (wetEditing.key !== 'maxWet') $('wetMaxOut').value = maxWet.toFixed(2);
}

const wetFrom = e => {
    const box = $('dual').getBoundingClientRect();
    const f = clamp((e.clientX - box.left) / box.width, 0, 1);
    if (dragOn.wet === 'min') minWet = Math.min(f, maxWet - 0.02);
    else maxWet = Math.max(f, minWet + 0.02);
    paintWet();
    return dragOn.wet === 'min' ? minWet : maxWet;
};

function bindThumb(id, which) {
    const el = $(id);
    const ch = which === 'min' ? 'minWet' : 'maxWet';
    el.addEventListener('pointerdown', e => {
        dragOn.wet = which;
        el.setPointerCapture(e.pointerId);
        e.preventDefault();
        beginDrag();
        Cabbage.sendControlData({ channel: ch, value: wetFrom(e), gesture: 'begin' }, null);
    });
    el.addEventListener('pointermove', e => {
        if (dragOn.wet !== which) return;
        e.preventDefault();
        Cabbage.sendControlData({ channel: ch, value: wetFrom(e), gesture: 'value' }, null);
    });
    const up = () => {
        if (dragOn.wet !== which) return;
        dragOn.wet = null;
        endDrag();
        Cabbage.sendControlData({ channel: ch, value: which === 'min' ? minWet : maxWet, gesture: 'end' }, null);
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
}

function bindWetField(id, key) {
    const el = $(id);
    const p = { min: 0, max: 1, step: 0.01 };
    const commit = () => {
        if (wetEditing.key !== key) return;
        wetEditing.key = null;
        const v = parseNum(el.value, p);
        if (!isFinite(v)) { paintWet(); return; }
        if (key === 'minWet') minWet = clamp(v, 0, Math.max(0, maxWet - 0.02));
        else maxWet = clamp(v, Math.min(1, minWet + 0.02), 1);
        paintWet();
        Cabbage.sendControlData({ channel: key, value: key === 'minWet' ? minWet : maxWet, gesture: 'complete' }, null);
    };
    el.addEventListener('focus', () => { wetEditing.key = key; el.select(); });
    el.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); commit(); el.blur(); }
        else if (e.key === 'Escape') { e.preventDefault(); wetEditing.key = null; paintWet(); el.blur(); }
    });
    el.addEventListener('blur', commit);
    el.addEventListener('pointerdown', e => e.stopPropagation());
    el.addEventListener('dblclick', e => {
        e.preventDefault();
        wetEditing.key = null;
        if (key === 'minWet') minWet = WET_DEF.minWet; else maxWet = WET_DEF.maxWet;
        paintWet();
        el.blur();
        Cabbage.sendControlData({ channel: key, value: key === 'minWet' ? minWet : maxWet, gesture: 'complete' }, null);
    });
}

/* ---------------- 电平 ---------------- */
/* Csound 送来的是线性幅度（0dbfs=1 → 0..1），
   表柱按 dB 显示：0 dB 在顶，-60 dB 在底（与 Stasis / Orbita / Singularity 同一套）。 */
const METER_H = 70;                        // 必须与 .bar / .dbscale 的 CSS 高度一致
const DB_MIN = -60;
/* 刻度往 0 dB 挤：等响感知下高端要密、低端要疏 */
const DB_TICKS = [0, -6, -12, -18, -24, -30, -40, -50, -60];

const ampToDb = a => 20 * Math.log10(Math.max(Math.abs(a), 1e-6));
const dbToPos = db => clamp((db - DB_MIN) / (0 - DB_MIN), 0, 1);

function buildDbScales() {
    for (const id of ['scaleFL', 'scaleFR', 'scaleRL', 'scaleRR']) {
        const el = $(id);
        if (!el) continue;
        el.innerHTML = '';
        for (const db of DB_TICKS) {
            const t = document.createElement('div');
            t.className = 't' + (db === 0 ? ' zero' : '') + (db % 12 === 0 ? ' major' : '');
            t.style.bottom = (dbToPos(db) * 100).toFixed(3) + '%';
            const n = document.createElement('span');
            n.className = 'n';
            n.textContent = db === 0 ? '0' : String(db);
            t.appendChild(n);
            el.appendChild(t);
        }
    }
}

function setMeter(id, capId, amp) {
    const db = clamp(ampToDb(amp), DB_MIN, 0);
    const pos = dbToPos(db);
    $(id).style.transform = 'scaleY(' + pos.toFixed(4) + ')';
    const cap = $(capId);
    cap.style.transform = 'translateY(' + (-pos * METER_H).toFixed(1) + 'px)';
    cap.style.opacity = pos > 0.002 ? '.95' : '0';
    return amp;
}
function updateGlow() {
    const lv = Math.max(lvlFL, lvlFR, lvlRL, lvlRR);
    document.documentElement.style.setProperty('--lvl', lv.toFixed(3));
}

/* ---------------- 接收后端 ---------------- */
function applyValue(id, v) {
    if (typeof v !== 'number' || isNaN(v)) return;
    switch (id) {
        case 'levy_x':
            levyX = clamp(v, 0, 1); placeBall(); pushTrail(levyX, levyY);
            break;
        case 'levy_y':
            levyY = clamp(v, 0, 1); placeBall(); pushTrail(levyX, levyY);
            break;
        case 'rate':     if (!dragOn.rate)     { rate = clamp(v, P.rate.min, P.rate.max); paintKnob('rate'); } break;
        case 'alpha':    if (!dragOn.alpha)    { alpha = clamp(v, P.alpha.min, P.alpha.max); paintKnob('alpha'); } break;
        case 'scale':    if (!dragOn.scale)    { scaleV = clamp(v, P.scale.min, P.scale.max); paintKnob('scale'); } break;
        case 'damp':     if (!dragOn.damp)     { damp = clamp(v, P.damp.min, P.damp.max); paintKnob('damp'); } break;
        case 'chaos':    if (!dragOn.chaos)    { chaos = clamp(v, P.chaos.min, P.chaos.max); paintKnob('chaos'); } break;
        case 'inertia':  if (!dragOn.inertia)  { inertia = clamp(v, P.inertia.min, P.inertia.max); paintKnob('inertia'); } break;
        case 'roomSize': if (!dragOn.roomSize) { room = clamp(v, P.roomSize.min, P.roomSize.max); paintKnob('roomSize'); } break;
        case 'cutoff':   if (!dragOn.cutoff)   { cut = clamp(v, P.cutoff.min, P.cutoff.max); paintKnob('cutoff'); } break;
        case 'masterGain': if (!dragOn.masterGain) { gain = clamp(v, P.masterGain.min, P.masterGain.max); paintKnob('masterGain'); } break;
        case 'minWet':   if (dragOn.wet !== 'min') { minWet = clamp(v, 0, 1); paintWet(); } break;
        case 'maxWet':   if (dragOn.wet !== 'max') { maxWet = clamp(v, 0, 1); paintWet(); } break;
        case 'outFL':
            lvlFL = setMeter('mtrFL', 'capFL', v);
            updateGlow();
            break;
        case 'outFR':
            lvlFR = setMeter('mtrFR', 'capFR', v);
            updateGlow();
            break;
        case 'outRL':
            lvlRL = setMeter('mtrRL', 'capRL', v);
            updateGlow();
            break;
        case 'outRR':
            lvlRR = setMeter('mtrRR', 'capRR', v);
            updateGlow();
            break;

    }
}

Cabbage.addMessageListener(msg => {
    const data = msg.data ?? msg;
    if (msg.command === 'widgetUpdate') {
        const id = data.id ?? data.channel;
        const v = data.value !== undefined ? data.value : Cabbage.extractValue(data, id);
        applyValue(id, v);
    } else if (msg.command === 'batchWidgetUpdate') {
        for (const w of msg.widgets ?? []) {
            const e = w.data ?? w;
            applyValue(e.id, Cabbage.extractValue(e, e.id));
        }
    } else if (msg.command === 'resizeResponse') {
        if (hostResize !== 'accepted') {
            const d = msg.data ?? msg;
            hostResize = d.accepted ? 'accepted' : 'rejected';
            if (hostResize === 'accepted') { reqViewport = 0; clearTimeout(reqTimer); }
            paintZoomBadge();
        }
    } else if (msg.command === 'parameterChange') {
        const pm = msg.data ?? msg;
        const id = typeof pm.channel === 'string' ? pm.channel : PARAM_IDX[pm.paramIdx];
        if (id) applyValue(id, pm.value);
    }
});

/* ---------------- 窗口缩放 ----------------
   1. 向宿主请求改变窗口尺寸（Cabbage.requestResize）
   2. 画布按实际视口自适应，宿主不配合时也填满可用空间
   拖动右下角三角：往下拖变大、往上拖变小，双击回 100%。 */
const CANVAS = { w: 380, h: 560 };
/* 默认呈现比例 = 宿主窗口 / 设计稿。改这一个数就是改插件默认尺寸：
   前端布局始终按 380×560 的设计单位写，缩放机制负责整体放大，不用逐条改 CSS。 */
const BASE = 4 / 3;
const MIN_SCALE = 0.75 * BASE;          // 下限仍是「默认尺寸的 75%」
const MAX_FILL = 0.94;
const screenW = () => (screen.availWidth || screen.width || 0);
const screenH = () => (screen.availHeight || screen.height || 0);

function maxScale() {
    const sw = screenW(), sh = screenH();
    const byW = sw ? sw / CANVAS.w : 3;
    const byH = sh ? sh / CANVAS.h : 3;
    /* 不能给下限兜底，否则小屏上兜底值会突破高度上限 */
    return Math.max(MIN_SCALE, Math.min(12, Math.min(byW, byH) * MAX_FILL));
}

const viewScale = () => Math.min(innerWidth / CANVAS.w, innerHeight / CANVAS.h);
/* 必须用屏幕绝对坐标：clientY 相对窗口，宿主 resize 时窗口移动会让它漂移并反馈成反向 */
const yOf = e => (typeof e.screenY === 'number' && e.screenY !== 0) ? e.screenY : e.clientY;

let hostResize = 'unknown', reqViewport = 0, reqTimer = 0;
let zoomDrag = null, holdScale = null;
let pendingScale = null, rafId = 0, lastSent = 0, dragEndedAt = 0;

function paintZoomBadge(override) {
    const s = override != null ? override : viewScale();
    /* 无条件写 --zoom：拖动时画布要「领先」窗口，否则先露白边 */
    document.body.style.setProperty('--zoom', s.toFixed(4));
    $('zpct').textContent = Math.round(s / BASE * 100) + '%';   /* 相对默认尺寸 */
    $('zoomer').dataset.host = hostResize;
}

function fitToViewport() {
    if (reqViewport && (innerWidth !== reqViewport.w || innerHeight !== reqViewport.h)) {
        reqViewport = 0; clearTimeout(reqTimer); hostResize = 'accepted';
    }
    if (holdScale != null && Math.abs(viewScale() - holdScale) < 0.01) holdScale = null;
    paintZoomBadge(zoomDrag && zoomDrag.moved ? zoomDrag.target : (holdScale ?? undefined));
}

function requestWindowScale(sc) {
    let w = Math.round(CANVAS.w * sc);
    let h = Math.round(CANVAS.h * sc);
    const limit = Math.floor(screenH() * MAX_FILL);
    if (limit > 0 && h > limit) { h = limit; w = Math.round(h * CANVAS.w / CANVAS.h); }
    reqViewport = { w: innerWidth, h: innerHeight };
    clearTimeout(reqTimer);
    reqTimer = setTimeout(() => {
        if (reqViewport) { reqViewport = 0; hostResize = 'rejected'; holdScale = null; paintZoomBadge(); }
    }, 600);
    Cabbage.requestResize(w, h, null);
}

function scheduleResizeRequest() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
        rafId = 0;
        if (pendingScale == null) return;
        if (lastSent && Math.abs(pendingScale - lastSent) < 0.004) return;
        lastSent = pendingScale;
        requestWindowScale(lastSent);
    });
}

$('zoomer').addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    $('zoomer').setPointerCapture(e.pointerId);
    const s = viewScale();
    /* ceiling 不能低于当前比例，否则「往下拖想变大」第一帧反而缩一下 */
    zoomDrag = { anchorY: yOf(e), startScale: s, moved: false, target: s,
                 ceiling: Math.max(s, maxScale()) };
    dragOn.zoom = true;
    document.body.classList.add('dragging-zoom');
});

$('zoomer').addEventListener('pointermove', e => {
    if (!zoomDrag) return;
    /* 拖的是右下角：往下 = 拉角出去 = 变大 */
    const dy = yOf(e) - zoomDrag.anchorY;
    if (!zoomDrag.moved && Math.abs(dy) < 2) return;
    zoomDrag.moved = true;
    e.preventDefault();
    const raw = zoomDrag.startScale * Math.exp(dy / 220);
    const target = Math.min(zoomDrag.ceiling, Math.max(MIN_SCALE, raw));
    zoomDrag.target = target;
    pendingScale = target;
    paintZoomBadge(target);
    scheduleResizeRequest();
});

function endZoomDrag(e) {
    if (!zoomDrag) return;
    const moved = zoomDrag.moved;
    const finalScale = zoomDrag.target;
    zoomDrag = null;
    pendingScale = null;
    dragOn.zoom = false;
    document.body.classList.remove('dragging-zoom');
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    try { $('zoomer').releasePointerCapture(e.pointerId); } catch (_) {}
    if (moved) {
        dragEndedAt = performance.now();
        /* rAF 可能还没轮到，松手必须补发最终值 */
        if (Math.abs(finalScale - lastSent) >= 0.004) {
            lastSent = finalScale;
            requestWindowScale(finalScale);
        }
        holdScale = finalScale;
        paintZoomBadge(finalScale);
        return;
    }
    paintZoomBadge();
}
$('zoomer').addEventListener('pointerup', endZoomDrag);
$('zoomer').addEventListener('pointercancel', endZoomDrag);

/* 双击回 100%（= BASE，即默认尺寸）；刚拖完 400ms 内忽略 */
$('zoomer').addEventListener('dblclick', e => {
    e.preventDefault();
    if (performance.now() - dragEndedAt < 400) return;
    lastSent = BASE;
    holdScale = BASE;
    requestWindowScale(BASE);
    paintZoomBadge(BASE);
});

function initZoom() {
    paintZoomBadge();
    lastSent = viewScale();
    new ResizeObserver(fitToViewport).observe(document.documentElement);
    addEventListener('resize', fitToViewport);
}

/* ---------------- 启动 ---------------- */
buildTicks('tRate');
buildTicks('tAlpha');
buildTicks('tScale');
buildTicks('tDamp');
buildTicks('tChaos');
buildTicks('tInertia');
buildTicks('tRoom');
buildTicks('tCut');
buildTicks('tGain');

for (const g of ['gRate', 'gAlpha', 'gScale', 'gDamp', 'gChaos', 'gInertia', 'gRoom', 'gCut', 'gGain']) {
    $(g).setAttribute('stroke-dasharray', SPAN.toFixed(2) + ' ' + CIRC.toFixed(2));
}

bindKnob('kRate', 'rate');
bindKnob('kAlpha', 'alpha');
bindKnob('kScale', 'scale');
bindKnob('kDamp', 'damp');
bindKnob('kChaos', 'chaos');
bindKnob('kInertia', 'inertia');
bindKnob('kRoom', 'roomSize');
bindKnob('kCut', 'cutoff');
bindKnob('kGain', 'masterGain');

bindThumb('thumbMin', 'min');
bindThumb('thumbMax', 'max');
bindWetField('wetMinOut', 'minWet');
bindWetField('wetMaxOut', 'maxWet');

initZoom();

placeBall();
paintWet();
for (const k of Object.keys(P)) paintKnob(k);

buildDbScales();
setMeter('mtrFL', 'capFL', 0);
setMeter('mtrFR', 'capFR', 0);
setMeter('mtrRL', 'capRL', 0);
setMeter('mtrRR', 'capRR', 0);

Cabbage.sendCustomCommand('cabbageIsReadyToLoad', null);
/* ---------------- 内置使用手册 ----------------
   顶栏 ? 在 iframe 里打开 help.html。只用内嵌：WebView 里 window.open 是死按钮。 */
import('./help-ui.js').then(({ attachHelp }) => attachHelp())
    .catch(e => console.warn('Cabbage: 手册模块不可用 —', e));
</script>
</body>
</html>
